    } else if (t === T.BRICK) {
      if (this.powerState > 0) {
        this.triggerBlockBounce(r, c);
        this.grid[r][c] = T.EMPTY;
        psg.sfxBreak();
        this.addScore(50, c * TILE, r * TILE);
        this.spawnBrickDebris(c * TILE + 4, r * TILE + 4);
      } else {
        this.triggerBlockBounce(r, c);
        psg.sfxBump();
      }
    } else {
      psg.sfxBump();
    }
  }

  spawnItemHop(type, x, y) {
    let spawnY = y + 3;
    const c = Math.floor((x + 4) / TILE);
    const rAbove = Math.floor((y - 2) / TILE);

    if (rAbove >= 0 && rAbove < ROWS && c >= 0 && c < COLS && isSolidTile(this.grid[rAbove][c])) {
      if (c + 1 < COLS && !isSolidTile(this.grid[rAbove][c + 1])) {
        x = (c + 1) * TILE;
      } else if (c - 1 >= 0 && !isSolidTile(this.grid[rAbove][c - 1])) {
        x = (c - 1) * TILE;
      }
    }

    this.items.push({
      type,
      x,
      y: spawnY,
      w: 8,
      h: 8,
      vx: type === 'mushroom' ? 0.45 : 0,
      vy: -1.65,
      hopTimer: 14
    });
  }

  checkGoalAndCoins() {
    const p = this.player;
    const c1 = Math.floor(p.x / TILE);
    const c2 = Math.floor((p.x + p.w - 0.1) / TILE);
    const r1 = Math.floor(p.y / TILE);
    const r2 = Math.floor((p.y + p.h - 0.1) / TILE);

    for (let r = r1; r <= r2; r++) {
      for (let c = c1; c <= c2; c++) {
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && this.grid[r][c] === T.COIN) {
          this.grid[r][c] = T.EMPTY;
          this.collectCoin(c * TILE + 4, r * TILE + 4);
        }
      }
    }

    if (!this.goal.reached) {
      const touchedPoleRay = (
        p.x <= this.goal.x &&
        p.x + p.w >= this.goal.x &&
        p.y <= this.goal.baseY
      );
      if (touchedPoleRay) {
        this.goal.reached = true;
        this.state = 'STAGE_CLEAR';
        this.stateTimer = 110;
        const grabFootY = p.y + p.h;
        p.crouching = false;
        this.updatePlayerHitbox();
        p.x = this.goal.x - p.w;
        p.y = Math.max(this.goal.y, Math.min(this.goal.baseY - 3 - p.h, grabFootY - p.h));
        p.vx = 0;
        p.vy = 0;
        p.dir = 1;

        const ballBottomY = this.goal.y + 1;
        const poleBaseTopY = this.goal.baseY - 3;
        const climbSpan = Math.max(1, poleBaseTopY - ballBottomY);
        const heightFromBase = poleBaseTopY - grabFootY;
        const ratio = heightFromBase / climbSpan;

        let bonus = 200;
        if (grabFootY <= ballBottomY) {
          bonus = 5000;
        } else if (ratio >= 0.72) {
          bonus = 2000;
        } else if (ratio >= 0.48) {
          bonus = 1000;
        } else if (ratio >= 0.24) {
          bonus = 500;
        } else {
          bonus = 200;
        }

        this.addScore(bonus, this.goal.x + 6, Math.max(12, Math.round(p.y)));
        psg.sfxClear();
      }
    }
  }

  collectCoin(x, y) {
    this.coins++;
    this.addScore(100, x, y);
    psg.sfxCoin();
    if (this.coins >= 50) {
      this.coins -= 50;
      this.lives++;
      this.popups.push({ text: '1UP', x, y: y - 6, timer: 42, color: MSX.LIGHT_GREEN });
    }
  }

  addScore(pts, x, y) {
    this.score += pts;
    this.updateHighRecords();
    if (x !== undefined) {
      this.popups.push({ text: String(pts), x, y, timer: 36, color: MSX.WHITE });
    }
  }

  updateItems() {
    const p = this.player;
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];

      if (it.hopTimer > 0) {
        it.hopTimer--;
        it.y += it.vy;
        it.vy += 0.14;
      } else if (it.type === 'mushroom') {
        it.x += it.vx;
        if (it.x <= 1 || it.x + it.w >= 255) it.vx = -it.vx;

        const rMid = Math.floor((it.y + 4) / TILE);
        const cEdge = Math.floor((it.vx > 0 ? it.x + it.w : it.x) / TILE);
        if (rMid >= 0 && rMid < ROWS && cEdge >= 0 && cEdge < COLS && isSolidTile(this.grid[rMid][cEdge])) {
          it.vx = -it.vx;
        }

        it.vy = Math.min(2.5, it.vy + 0.14);
        it.y += it.vy;
        const rFoot = Math.floor((it.y + it.h) / TILE);
        const cMid = Math.floor((it.x + 4) / TILE);
        if (rFoot >= 0 && rFoot < ROWS && cMid >= 0 && cMid < COLS && isTopSolidTile(this.grid[rFoot][cMid])) {
          it.y = rFoot * TILE - it.h;
          it.vy = 0;
        }
      } else if (it.type === 'flower') {
        it.vy = Math.min(2.0, it.vy + 0.14);
        it.y += it.vy;
        const rFoot = Math.floor((it.y + it.h) / TILE);
        const cMid = Math.floor((it.x + 4) / TILE);
        if (rFoot >= 0 && rFoot < ROWS && cMid >= 0 && cMid < COLS && isTopSolidTile(this.grid[rFoot][cMid])) {
          it.y = rFoot * TILE - it.h;
          it.vy = 0;
        }
      }

      const rHead = Math.floor(it.y / TILE);
      const cHead = Math.floor((it.x + 4) / TILE);
      if (rHead >= 0 && rHead < ROWS && cHead >= 0 && cHead < COLS && isSolidTile(this.grid[rHead][cHead])) {
        it.y = (rHead + 1) * TILE;
      }

      if (this.aabb(p, it)) {
        this.items.splice(i, 1);
        psg.sfxPowerup();
        this.addScore(500, it.x, it.y);
        if (it.type === 'mushroom') {
          if (this.powerState === 0) {
            this.powerState = 1;
            this.updatePlayerHitbox();
          }
        } else if (it.type === 'flower') {
          this.powerState = 2;
          this.updatePlayerHitbox();
        }
      }
    }
  }

  updateFireballs() {
    for (let i = this.fireballs.length - 1; i >= 0; i--) {
      const fb = this.fireballs[i];
      fb.x += fb.vx;
      fb.vy = Math.min(2.4, fb.vy + 0.16);
      fb.y += fb.vy;

      if (fb.x < 0 || fb.x > 256 || fb.y > 192) {
        this.fireballs.splice(i, 1);
        continue;
      }

      const c = Math.floor((fb.x + 2) / TILE);
      const r = Math.floor((fb.y + 2) / TILE);
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        if (isTopSolidTile(this.grid[r][c]) && fb.vy > 0) {
          fb.y = r * TILE - 4;
          fb.vy = -1.75;
        } else if (isSolidTile(this.grid[r][c])) {
          this.spawnSparkle(fb.x, fb.y);
          this.fireballs.splice(i, 1);
          continue;
        }
      }

      let hit = false;
      for (const en of this.enemies) {
        if (en.deadTimer === 0 && this.aabb({ x: fb.x, y: fb.y, w: 4, h: 4 }, en)) {
          en.deadTimer = 18;
          en.vy = -1.4;
          this.addScore(200, en.x, en.y);
          psg.sfxStomp();
          hit = true;
          break;
        }
      }

      if (!hit && this.boss && this.aabb({ x: fb.x, y: fb.y, w: 4, h: 4 }, this.boss)) {
        this.damageBoss(1);
        hit = true;
      }

      if (hit) {
        this.spawnSparkle(fb.x, fb.y);
        this.fireballs.splice(i, 1);
      }
    }
  }

  updateEnemies() {
    const p = this.player;
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const en = this.enemies[i];
      if (en.kickCooldown > 0) en.kickCooldown--;

      if (en.deadTimer > 0) {
        en.deadTimer--;
        en.y += en.vy;
        en.vy += 0.15;
        if (en.deadTimer <= 0) this.enemies.splice(i, 1);
        continue;
      }

      if (en.shell && !en.shellMoving) {
        en.vx = 0;
      } else {
        const speed = en.shellMoving ? 1.7 : Math.abs(en.vx);
        const dir = en.vx >= 0 ? 1 : -1;
        en.x += dir * speed;

        if (!en.shellMoving) {
          if (en.x <= en.minX) { en.x = en.minX; en.vx = Math.abs(en.vx); }
          if (en.x >= en.maxX) { en.x = en.maxX; en.vx = -Math.abs(en.vx); }
        } else {
          if (en.x <= 2 || en.x >= 246) en.vx = -en.vx;
        }

        const rMid = Math.floor((en.y + 4) / TILE);
        const cFront = Math.floor((en.vx > 0 ? en.x + en.w : en.x) / TILE);
        if (rMid >= 0 && rMid < ROWS && cFront >= 0 && cFront < COLS && isSolidTile(this.grid[rMid][cFront])) {
          en.vx = -en.vx;
        }
      }

      en.vy = Math.min(2.5, en.vy + 0.15);
      en.y += en.vy;
      const rFoot = Math.floor((en.y + en.h) / TILE);
      const cMid = Math.floor((en.x + 4) / TILE);
      if (rFoot >= 0 && rFoot < ROWS && cMid >= 0 && cMid < COLS && isTopSolidTile(this.grid[rFoot][cMid])) {
        en.y = rFoot * TILE - en.h;
        en.vy = 0;
      }

      if (en.shellMoving) {
        for (const other of this.enemies) {
          if (other !== en && other.deadTimer === 0 && this.aabb(en, other)) {
            other.deadTimer = 18;
            other.vy = -1.5;
            this.addScore(200, other.x, other.y);
            psg.sfxStomp();
          }
        }
      }
    }

    for (let i = 0; i < this.enemies.length; i++) {
      const a = this.enemies[i];
      if (a.deadTimer > 0 || a.shellMoving) continue;
      for (let j = i + 1; j < this.enemies.length; j++) {
        const b = this.enemies[j];
        if (b.deadTimer > 0 || b.shellMoving) continue;

        const verticalOverlap = (a.y < b.y + b.h - 2) && (a.y + a.h > b.y + 2);
        if (!verticalOverlap) continue;

        const overlapX = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        if (overlapX > 0) {
          const L = (a.x + a.w * 0.5 <= b.x + b.w * 0.5) ? a : b;
          const R = (L === a) ? b : a;

          if (!L.shell) {
            const spdL = Math.abs(L.vx) > 0.05 ? Math.abs(L.vx) : (L.type === 'spiny' ? 0.45 : 0.35);
            L.vx = -spdL;
          }
          if (!R.shell) {
            const spdR = Math.abs(R.vx) > 0.05 ? Math.abs(R.vx) : (R.type === 'spiny' ? 0.45 : 0.35);
            R.vx = spdR;
          }

          let remaining = overlapX + 0.1;
          const step = 0.25;
          while (remaining > 0.01) {
            const d = Math.min(step, remaining);
            let movedAny = false;
            const half = d * 0.5;

            if (this.canEnemyOccupyX(L, L.x - half)) {
              L.x -= half;
              movedAny = true;
            } else if (this.canEnemyOccupyX(R, R.x + half)) {
              R.x += half;
              movedAny = true;
            }

            if (this.canEnemyOccupyX(R, R.x + half)) {
              R.x += half;
              movedAny = true;
            } else if (this.canEnemyOccupyX(L, L.x - half)) {
              L.x -= half;
              movedAny = true;
            }

            if (!movedAny) break;
            remaining -= d;
          }
        }
      }
    }

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const en = this.enemies[i];
      if (en.deadTimer > 0) continue;

      const stompBox = { x: en.x - 0.5, y: en.y, w: en.w + 1, h: en.h };
      const hurtBox = { x: en.x + 2, y: en.y + 1, w: en.w - 4, h: en.h - 1 };

      if (this.aabb(p, stompBox)) {
        const playerBottom = p.y + p.h;
        const stomped = (p.vy > 0 && playerBottom <= en.y + 5.5 && en.type !== 'spiny');

        if (en.type === 'koopa' && !en.shell) {
          if (stomped) {
            p.vy = -2.25;
            en.shell = true;
            en.shellMoving = false;
            en.vx = 0;
            en.kickCooldown = 14;
            this.awardStompCombo(en, en.x, en.y);
          } else if (this.aabb(p, hurtBox)) {
            this.damagePlayer();
          }
        } else if (en.shell && !en.shellMoving) {
          if (en.kickCooldown <= 0 && (stomped || this.aabb(p, hurtBox))) {
            en.shellMoving = true;
            en.vx = (p.x + p.w / 2 < en.x + 4) ? 1.7 : -1.7;
            en.kickCooldown = 10;
            if (stomped) {
              p.vy = -2.1;
              this.awardStompCombo(en, en.x, en.y);
            } else {
              this.addScore(200, en.x, en.y);
              psg.sfxKick();
            }
          }
        } else if (en.shell && en.shellMoving) {
          if (stomped) {
            p.vy = -2.2;
            en.shellMoving = false;
            en.vx = 0;
            en.kickCooldown = 14;
            this.awardStompCombo(en, en.x, en.y);
          } else if (en.kickCooldown <= 0 && this.aabb(p, hurtBox)) {
            this.damagePlayer();
          }
        } else {
          if (stomped) {
            p.vy = -2.2;
            en.deadTimer = 18;
            en.vy = -1.4;
            this.awardStompCombo(en, en.x, en.y);
          } else if (this.aabb(p, hurtBox)) {
            this.damagePlayer();
          }
        }
      }
    }
  }

  updateBoss() {
    const b = this.boss;
    if (!b) return;
    if (b.hurtTimer > 0) b.hurtTimer--;

    b.x += b.vx;
    if (b.x <= b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
    if (b.x >= b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }

    b.fireTimer--;
    if (b.fireTimer <= 0) {
      b.fireTimer = 105;
      const dir = (this.player.x < b.x) ? -1 : 1;
      this.enemyFires.push({
        x: dir === -1 ? b.x - 6 : b.x + b.w,
        y: b.y + 6,
        vx: dir * 1.15
      });
      psg.sfxFire();
    }

    for (let i = this.enemyFires.length - 1; i >= 0; i--) {
      const ef = this.enemyFires[i];
      ef.x += ef.vx;
      if (ef.x < 0 || ef.x > 256) {
        this.enemyFires.splice(i, 1);
        continue;
      }
      if (this.aabb(this.player, { x: ef.x, y: ef.y, w: 6, h: 4 })) {
        this.enemyFires.splice(i, 1);
        this.damagePlayer();
      }
    }

    if (this.aabb(this.player, b)) {
      if (this.player.vy > 0 && this.player.y + this.player.h <= b.y + 6) {
        this.player.vy = -2.4;
        this.damageBoss(1);
      } else {
        this.damagePlayer();
      }
    }
  }

  damageBoss(dmg) {
    const b = this.boss;
    if (!b || b.hurtTimer > 0) return;
    b.hp -= dmg;
    b.hurtTimer = 25;
    psg.sfxStomp();
    if (b.hp <= 0) {
      this.addScore(2000, b.x, b.y);
      this.spawnBrickDebris(b.x + 7, b.y + 8);
      this.boss = null;
      this.enemyFires = [];
    }
  }

  damagePlayer() {
    const p = this.player;
    if (p.invuln > 0) return;

    if (this.powerState > 0) {
      this.powerState = 0;
      p.crouching = false;
      this.updatePlayerHitbox();
      p.invuln = 80;
      p.shrinkAnim = 56;
      psg.sfxShrink();
    } else {
      this.killPlayer();
    }
  }

  killPlayer() {
    this.stompCombo = 0;
    this.combo1UpCount = 0;
    this.state = 'DYING';
    this.stateTimer = 75;
    this.player.vy = -2.6;
    psg.sfxDie();
  }

  spawnSparkle(x, y) {
    for (let i = 0; i < 6; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 2.2,
        vy: (Math.random() - 0.5) * 2.2,
        life: 16,
        color: i % 2 === 0 ? MSX.WHITE : MSX.LIGHT_YELLOW
      });
    }
  }

  spawnBrickDebris(x, y) {
    const theme = this.getTheme();
    for (let i = 0; i < 4; i++) {
      this.particles.push({
        x, y,
        vx: (i % 2 === 0 ? -1 : 1) * (0.7 + Math.random() * 0.6),
        vy: -1.8 - Math.random() * 0.8,
        life: 26,
        gravity: true,
        color: theme.brickMain
      });
    }
  }

  updateParticlesAndPopups() {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx;
      pt.y += pt.vy;
      if (pt.gravity) pt.vy += 0.16;
      pt.life--;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const pop = this.popups[i];
      pop.y -= 0.35;
      pop.timer--;
      if (pop.timer <= 0) this.popups.splice(i, 1);
    }
  }

  canEnemyOccupyX(en, candidateX) {
    if (candidateX < 2 || candidateX + en.w > 254) return false;
    const r1 = Math.floor((en.y + 1) / TILE);
    const r2 = Math.floor((en.y + en.h - 1) / TILE);
    const c1 = Math.floor(candidateX / TILE);
    const c2 = Math.floor((candidateX + en.w - 0.01) / TILE);
    for (let r = r1; r <= r2; r++) {
      if (r < 0 || r >= ROWS) continue;
      for (let c = c1; c <= c2; c++) {
        if (c < 0 || c >= COLS) return false;
        if (isSolidTile(this.grid[r][c])) return false;
      }
    }
    return true;
  }

  aabb(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  // ==========================================================================
  // AUTHENTIC MSX1 (256x192) PIXEL RENDERER
  // ==========================================================================
  render() {
    const ctx = this.ctx;

    if (this.state === 'TITLE') {
      this.renderTitleScreen(ctx);
      return;
    }
    if (this.state === 'READY') {
      this.renderReadyScreen(ctx);
      return;
    }
    if (this.state === 'CREDITS') {
      this.renderCreditsScreen(ctx);
      return;
    }
    if (this.state === 'GAMEOVER') {
      this.renderGameOverScreen(ctx);
      return;
    }

    const theme = this.getTheme();

    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, 256, 192);
    this.renderBackgroundDeco(ctx, theme);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = this.grid[r][c];
        if (t !== T.EMPTY) {
          let offsetY = 0;
          for (const bb of this.bouncingBlocks) {
            if (bb.r === r && bb.c === c) {
              offsetY = -Math.round(Math.sin((bb.timer / bb.maxTimer) * Math.PI) * 4);
              break;
            }
          }
          this.drawTile(ctx, t, c * 8, r * 8 + offsetY, theme);
        }
      }
    }

    this.drawGoalFlag(ctx);

    this.lifts.forEach((lift) => {
      ctx.fillStyle = MSX.LIGHT_YELLOW;
      ctx.fillRect(Math.round(lift.x), Math.round(lift.y), lift.w, lift.h);
      ctx.fillStyle = MSX.DARK_RED;
      ctx.fillRect(Math.round(lift.x), Math.round(lift.y) + 2, lift.w, 2);
    });

    this.items.forEach((it) => {
      const ix = Math.round(it.x);
      const iy = Math.round(it.y);
      if (it.type === 'mushroom') {
        ctx.fillStyle = MSX.MED_RED;
        ctx.fillRect(ix + 1, iy, 6, 4);
        ctx.fillStyle = MSX.WHITE;
        ctx.fillRect(ix + 2, iy + 1, 1, 1);
        ctx.fillRect(ix + 5, iy + 1, 1, 1);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(ix + 2, iy + 4, 4, 4);
      } else {
        ctx.fillStyle = MSX.MED_GREEN;
        ctx.fillRect(ix + 3, iy + 5, 2, 3);
        ctx.fillStyle = (this.frame % 8 < 4) ? MSX.MED_RED : MSX.LIGHT_YELLOW;
        ctx.fillRect(ix + 1, iy + 1, 6, 4);
        ctx.fillStyle = MSX.WHITE;
        ctx.fillRect(ix + 3, iy + 2, 2, 2);
      }
    });

    this.enemies.forEach((en) => this.drawEnemy(ctx, en));
    if (this.boss) this.drawBoss(ctx, this.boss);

    this.fireballs.forEach((fb) => {
      ctx.fillStyle = (this.frame % 4 < 2) ? MSX.LIGHT_YELLOW : MSX.MED_RED;
      ctx.fillRect(Math.round(fb.x), Math.round(fb.y), 4, 4);
    });
    this.enemyFires.forEach((ef) => {
      ctx.fillStyle = (this.frame % 4 < 2) ? MSX.MED_RED : MSX.LIGHT_YELLOW;
      ctx.fillRect(Math.round(ef.x), Math.round(ef.y), 6, 4);
    });

    this.drawPlayer(ctx);

    this.particles.forEach((pt) => {
      ctx.fillStyle = pt.color;
      ctx.fillRect(Math.round(pt.x), Math.round(pt.y), 2, 2);
    });
    this.popups.forEach((pop) => {
      this.drawText(ctx, pop.text, Math.round(pop.x) - 6, Math.round(pop.y), pop.color);
    });

    this.drawHUD(ctx);
  }

  renderBackgroundDeco(ctx, theme) {
    if (theme.deco === 'clouds') {
      ctx.fillStyle = MSX.WHITE;
      const clouds = [[36, 22], [124, 18], [198, 28], [68, 72], [176, 68]];
      clouds.forEach(([cx, cy]) => {
        ctx.fillRect(cx + 4, cy, 12, 4);
        ctx.fillRect(cx, cy + 4, 20, 4);
      });
    } else if (theme.deco === 'crystals') {
      ctx.fillStyle = MSX.DARK_BLUE;
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(24 + i * 42, 30 + (i % 2) * 48, 3, 6);
      }
    } else if (theme.deco === 'stars') {
      ctx.fillStyle = MSX.LIGHT_YELLOW;
      for (let i = 0; i < 12; i++) {
        ctx.fillRect((i * 23 + 11) % 248, (i * 19 + 14) % 150, 1, 1);
      }
    } else if (theme.deco === 'pillars') {
      ctx.fillStyle = '#181822';
      for (let c = 4; c < 30; c += 7) {
        ctx.fillRect(c * 8, 12, 8, 164);
      }
    }
  }

  drawTile(ctx, t, x, y, theme) {
    switch (t) {
      case T.GROUND:
        ctx.fillStyle = theme.groundBody;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = theme.groundTop;
        ctx.fillRect(x, y, 8, 2);
        ctx.fillStyle = MSX.BLACK;
        ctx.fillRect(x + 2, y + 4, 1, 1);
        ctx.fillRect(x + 6, y + 6, 1, 1);
        break;

      case T.BRICK:
        ctx.fillStyle = theme.brickMain;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = theme.brickLine;
        ctx.fillRect(x, y + 3, 8, 1);
        ctx.fillRect(x, y + 7, 8, 1);
        ctx.fillRect(x + 3, y, 1, 3);
        ctx.fillRect(x + 7, y + 4, 1, 3);
        break;

      case T.HARD:
        ctx.fillStyle = theme.hardMain;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = theme.hardDark;
        ctx.fillRect(x + 1, y + 6, 7, 2);
        ctx.fillRect(x + 6, y + 1, 2, 7);
        ctx.fillStyle = MSX.BLACK;
        ctx.fillRect(x + 7, y, 1, 8);
        ctx.fillRect(x, y + 7, 8, 1);
        break;

      case T.Q_COIN:
      case T.Q_POWER:
      case T.Q_VINE:
        ctx.fillStyle = (this.frame % 24 < 12) ? MSX.LIGHT_YELLOW : MSX.DARK_YELLOW;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = MSX.DARK_RED;
        ctx.fillRect(x + 2, y + 1, 4, 1);
        ctx.fillRect(x + 5, y + 2, 1, 2);
        ctx.fillRect(x + 3, y + 4, 2, 1);
        ctx.fillRect(x + 3, y + 6, 1, 1);
        break;

      case T.USED:
        ctx.fillStyle = MSX.GRAY;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = MSX.BLACK;
        ctx.fillRect(x + 1, y + 1, 1, 1);
        ctx.fillRect(x + 6, y + 1, 1, 1);
        ctx.fillRect(x + 1, y + 6, 1, 1);
        ctx.fillRect(x + 6, y + 6, 1, 1);
        break;

      case T.PIPE_TL:
      case T.PIPE_BL:
        ctx.fillStyle = theme.pipeLight;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = MSX.WHITE;
        ctx.fillRect(x + 1, y, 2, 8);
        if (t === T.PIPE_TL) {
          ctx.fillStyle = MSX.BLACK;
          ctx.fillRect(x, y + 3, 8, 1);
        }
        break;

      case T.PIPE_TR:
      case T.PIPE_BR:
        ctx.fillStyle = theme.pipeDark;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = theme.pipeLight;
        ctx.fillRect(x, y, 3, 8);
        if (t === T.PIPE_TR) {
          ctx.fillStyle = MSX.BLACK;
          ctx.fillRect(x, y + 3, 8, 1);
        }
        break;

      case T.VINE:
        ctx.fillStyle = MSX.DARK_GREEN;
        ctx.fillRect(x + 3, y, 2, 8);
        ctx.fillStyle = MSX.LIGHT_GREEN;
        ctx.fillRect(x + 1, y + 1, 2, 2);
        ctx.fillRect(x + 5, y + 5, 2, 2);
        break;

      case T.COIN: {
        const w = (this.frame % 16 < 8) ? 4 : 2;
        const ox = (8 - w) / 2;
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(x + ox, y + 1, w, 6);
        ctx.fillStyle = MSX.DARK_YELLOW;
        ctx.fillRect(x + ox + w - 1, y + 1, 1, 6);
        break;
      }

      case T.LAVA: {
        ctx.fillStyle = MSX.MED_RED;
        ctx.fillRect(x, y, 8, 8);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        const wave = ((this.frame >> 3) + (x >> 3)) % 2;
        ctx.fillRect(x + wave * 2, y, 4, 2);
        break;
      }

      case T.MUSH_STEM:
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(x + 1, y, 6, 8);
        ctx.fillStyle = MSX.DARK_YELLOW;
        ctx.fillRect(x + 5, y, 2, 8);
        break;

      case T.MUSH_CAP_L:
      case T.MUSH_CAP_M:
      case T.MUSH_CAP_R:
        ctx.fillStyle = MSX.MED_RED;
        ctx.fillRect(x, y, 8, 6);
        ctx.fillStyle = MSX.WHITE;
        ctx.fillRect(x + 2, y + 1, 3, 3);
        break;

      case T.GOLD_CAP_L:
      case T.GOLD_CAP_M:
      case T.GOLD_CAP_R:
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(x, y, 8, 6);
        ctx.fillStyle = MSX.DARK_RED;
        ctx.fillRect(x + 2, y + 2, 3, 2);
        break;

      case T.ONEWAY:
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(x, y, 8, 2);
        ctx.fillStyle = MSX.DARK_RED;
        ctx.fillRect(x, y + 2, 8, 2);
        ctx.fillStyle = MSX.BLACK;
        ctx.fillRect(x + 2, y + 1, 1, 1);
        ctx.fillRect(x + 6, y + 1, 1, 1);
        break;
    }
  }

  drawGoalFlag(ctx) {
    const gx = this.goal.x;
    const gy = this.goal.y;
    const by = this.goal.baseY;

    ctx.fillStyle = MSX.WHITE;
    ctx.fillRect(gx - 1, gy, 2, by - gy - 2);

    ctx.fillStyle = MSX.LIGHT_YELLOW;
    ctx.fillRect(gx - 2, gy - 2, 4, 3);

    ctx.fillStyle = MSX.GRAY;
    ctx.fillRect(gx - 6, by - 3, 12, 1);
    ctx.fillStyle = MSX.WHITE;
    ctx.fillRect(gx - 5, by - 2, 10, 1);
    ctx.fillStyle = MSX.DARK_BLUE;
    ctx.fillRect(gx - 4, by - 1, 8, 1);

    const fy = Math.round(this.goal.flagY);
    ctx.fillStyle = MSX.MED_RED;
    ctx.fillRect(gx + 1, fy, 7, 5);
    ctx.fillStyle = MSX.WHITE;
    ctx.fillRect(gx + 2, fy + 1, 2, 2);
  }

  drawStickFigure(ctx, x, y, power, dir, crouching, walkFrame) {
    const step = Math.floor(walkFrame) % 2;
    if (power === 0) {
      const dx = x - 1;
      ctx.fillStyle = MSX.LIGHT_YELLOW;
      ctx.fillRect(dx + 2, y, 4, 3);
      ctx.fillStyle = MSX.MED_RED;
      ctx.fillRect(dx + 2, y, 4, 1);
      ctx.fillStyle = MSX.DARK_BLUE;
      ctx.fillRect(dx + 3, y + 3, 2, 3);
      ctx.fillStyle = MSX.LIGHT_YELLOW;
      ctx.fillRect(dx + 1, y + 3, 6, 1);
      ctx.fillStyle = MSX.DARK_RED;
      if (step === 0) {
        ctx.fillRect(dx + 2, y + 6, 1, 2);
        ctx.fillRect(dx + 5, y + 6, 1, 2);
      } else {
        ctx.fillRect(dx + 1, y + 6, 2, 2);
        ctx.fillRect(dx + 5, y + 6, 2, 2);
      }
    } else {
      const primary = (power === 2) ? MSX.WHITE : MSX.MED_RED;
      const secondary = (power === 2) ? MSX.MED_RED : MSX.DARK_BLUE;
      const dx = x - 1;

      if (crouching) {
        ctx.fillStyle = primary;
        ctx.fillRect(dx + 2, y, 4, 2);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(dx + 2, y + 2, 4, 2);
        ctx.fillStyle = secondary;
        ctx.fillRect(dx + 1, y + 4, 6, 4);
      } else {
        const topY = y - 2;
        ctx.fillStyle = primary;
        ctx.fillRect(dx + 2, topY, 4, 2);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(dx + 2, topY + 2, 4, 3);
        ctx.fillStyle = MSX.BLACK;
        ctx.fillRect(dir === 1 ? dx + 5 : dx + 2, topY + 3, 1, 1);
        ctx.fillStyle = primary;
        ctx.fillRect(dx + 3, topY + 5, 2, 5);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(dx + 1, topY + 6, 6, 1);
        ctx.fillStyle = secondary;
        if (step === 0) {
          ctx.fillRect(dx + 2, topY + 10, 1, 6);
          ctx.fillRect(dx + 5, topY + 10, 1, 6);
        } else {
          ctx.fillRect(dx + 1, topY + 10, 2, 5);
          ctx.fillRect(dx + 5, topY + 11, 2, 5);
        }
      }
    }
  }

  drawPlayer(ctx) {
    const p = this.player;
    if (p.invuln > 0 && p.shrinkAnim === 0 && (this.frame % 4 < 2)) {
      return;
    }

    const px = Math.round(p.x);
    const py = Math.round(p.y);

    if (p.shrinkAnim > 0) {
      const showBig = (this.frame % 8 < 4);
      if (showBig) {
        this.drawStickFigure(ctx, px, py - 6, 1, p.dir, false, p.animFrame);
      } else {
        this.drawStickFigure(ctx, px, py, 0, p.dir, false, p.animFrame);
      }
      return;
    }

    this.drawStickFigure(ctx, px, py, this.powerState, p.dir, p.crouching, p.animFrame);
  }

  drawEnemy(ctx, en) {
    const ex = Math.round(en.x);
    const ey = Math.round(en.y);
    const step = (this.frame >> 3) % 2;

    if (en.type === 'goomba') {
      ctx.fillStyle = MSX.DARK_RED;
      ctx.fillRect(ex + 1, ey, 6, 5);
      ctx.fillStyle = MSX.WHITE;
      ctx.fillRect(ex + 2, ey + 2, 1, 2);
      ctx.fillRect(ex + 5, ey + 2, 1, 2);
      ctx.fillStyle = MSX.LIGHT_YELLOW;
      ctx.fillRect(ex + (step ? 1 : 2), ey + 5, 2, 3);
      ctx.fillRect(ex + (step ? 5 : 4), ey + 5, 2, 3);
    } else if (en.type === 'koopa') {
      if (en.shell) {
        ctx.fillStyle = MSX.MED_GREEN;
        ctx.fillRect(ex + 1, ey + 2, 6, 6);
        ctx.fillStyle = MSX.WHITE;
        ctx.fillRect(ex + 2, ey + 3, 4, 2);
      } else {
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(en.vx < 0 ? ex : ex + 5, ey, 3, 3);
        ctx.fillStyle = MSX.MED_GREEN;
        ctx.fillRect(ex + 1, ey + 2, 6, 4);
        ctx.fillStyle = MSX.LIGHT_YELLOW;
        ctx.fillRect(ex + 2, ey + 6, 2, 2);
        ctx.fillRect(ex + 5, ey + 6, 2, 2);
      }
    } else if (en.type === 'spiny') {
      ctx.fillStyle = MSX.MED_RED;
      ctx.fillRect(ex + 1, ey + 2, 6, 5);
      ctx.fillStyle = MSX.WHITE;
      ctx.fillRect(ex + 2, ey, 1, 2);
      ctx.fillRect(ex + 5, ey, 1, 2);
      ctx.fillRect(ex + 2, ey + 7, 4, 1);
    }
  }

  drawBoss(ctx, b) {
    if (b.hurtTimer > 0 && (this.frame % 4 < 2)) return;
    const bx = Math.round(b.x);
    const by = Math.round(b.y);

    ctx.fillStyle = MSX.DARK_GREEN;
    ctx.fillRect(bx + 3, by + 2, 10, 11);
    ctx.fillStyle = MSX.WHITE;
    ctx.fillRect(bx + 11, by + 3, 3, 2);
    ctx.fillRect(bx + 11, by + 8, 3, 2);
    ctx.fillStyle = MSX.MED_GREEN;
    ctx.fillRect(bx, by, 6, 6);
    ctx.fillStyle = MSX.LIGHT_YELLOW;
    ctx.fillRect(bx + 1, by - 2, 2, 2);
    ctx.fillStyle = MSX.MED_RED;
    ctx.fillRect(bx + 1, by + 2, 2, 2);
    ctx.fillStyle = MSX.LIGHT_YELLOW;
    ctx.fillRect(bx + 2, by + 6, 4, 7);
    ctx.fillRect(bx + 2, by + 13, 3, 3);
    ctx.fillRect(bx + 8, by + 13, 3, 3);

    ctx.fillStyle = MSX.DARK_RED;
    ctx.fillRect(bx - 1, by - 6, 16, 2);
    ctx.fillStyle = MSX.LIGHT_GREEN;
    ctx.fillRect(bx - 1, by - 6, Math.max(0, Math.round((b.hp / b.maxHp) * 16)), 2);
  }

  drawHUD(ctx) {
    const worldNum = Math.floor((this.stage - 1) / 4) + 1;
    const subNum = ((this.stage - 1) % 4) + 1;
    const scoreStr = String(this.score).padStart(6, '0');
    const coinStr = String(this.coins).padStart(2, '0');

    this.drawText(ctx, `SC:${scoreStr}`, 4, 2, MSX.WHITE);
    this.drawText(ctx, `C:${coinStr}`, 84, 2, MSX.LIGHT_YELLOW);
    this.drawText(ctx, `ST:${worldNum}-${subNum}`, 132, 2, MSX.CYAN);
    this.drawText(ctx, `L:${this.lives}`, 206, 2, MSX.LIGHT_GREEN);
  }

  renderReadyScreen(ctx) {
    ctx.fillStyle = MSX.BLACK;
    ctx.fillRect(0, 0, 256, 192);

    const worldNum = Math.floor((this.stage - 1) / 4) + 1;
    const subNum = ((this.stage - 1) % 4) + 1;
    const isBoss = (subNum === 4);

    const stageLabel = isBoss ? `BOSS STAGE ${worldNum}-${subNum}` : `STAGE ${worldNum}-${subNum}`;
    this.drawTextCentered(ctx, stageLabel, 64, MSX.CYAN);

    this.drawStickFigure(ctx, 102, this.powerState > 0 ? 86 : 92, this.powerState, 1, false, 0);
    this.drawText(ctx, `x ${this.lives}`, 116, 93, MSX.WHITE);

    this.drawTextCentered(ctx, 'GET READY!', 124, MSX.LIGHT_YELLOW);
  }

  renderTitleScreen(ctx) {
    this.updateHighRecords();
    ctx.fillStyle = MSX.BLACK;
    ctx.fillRect(0, 0, 256, 192);

    ctx.fillStyle = MSX.DARK_BLUE;
    ctx.fillRect(8, 8, 240, 2);
    ctx.fillRect(8, 182, 240, 2);

    this.drawTextCentered(ctx, 'STICK RISE MSX', 28, MSX.CYAN);
    this.drawTextCentered(ctx, 'TMS9918A EDITION', 40, MSX.LIGHT_BLUE);

    this.drawStickFigure(ctx, 96, 72, 0, 1, false, this.frame * 0.15);
    this.drawStickFigure(ctx, 124, 66, 1, 1, false, this.frame * 0.15);
    this.drawStickFigure(ctx, 152, 66, 2, 1, false, this.frame * 0.15);

    const hiScoreStr = String(this.highScore).padStart(6, '0');
    const hiStageStr = this.formatStageLabel(this.highStage);
    this.drawTextCentered(ctx, `HI-SCORE ${hiScoreStr}`, 98, MSX.LIGHT_YELLOW);
    this.drawTextCentered(ctx, `HI-STAGE ${hiStageStr}`, 110, MSX.LIGHT_GREEN);

    if (this.frame % 40 < 26) {
      this.drawTextCentered(ctx, 'TAP OR PRESS START', 136, MSX.WHITE);
    }
    this.drawTextCentered(ctx, 'RISE TO THE SUMMIT!', 158, MSX.MED_GREEN);
  }

  renderCreditsScreen(ctx) {
    ctx.fillStyle = MSX.BLACK;
    ctx.fillRect(0, 0, 256, 192);

    ctx.fillStyle = MSX.DARK_BLUE;
    for (let i = 0; i < 16; i++) {
      const sx = (i * 19 + ((this.frame >> 2) % 16)) % 254;
      const sy = (i * 13 + 7) % 188;
      ctx.fillRect(sx, sy, 1, 1);
    }

    const baseY = Math.round(this.creditsScrollY);
    this.drawTextCentered(ctx, 'CONGRATULATION!', baseY + 0, MSX.LIGHT_YELLOW);
    this.drawTextCentered(ctx, 'STICK RISE MSX', baseY + 14, MSX.CYAN);

    this.drawTextCentered(ctx, '- CAST -', baseY + 34, MSX.LIGHT_GREEN);

    let y = baseY + 48;
    this.drawEnemy(ctx, { type: 'goomba', x: 36, y: y, vx: -0.35, shell: false });
    this.drawText(ctx, 'GOOMBA', 54, y + 1, MSX.WHITE);
    y += 14;

    this.drawEnemy(ctx, { type: 'koopa', x: 36, y: y, vx: -0.35, shell: false });
    this.drawText(ctx, 'KOOPA TROOPA', 54, y + 1, MSX.WHITE);
    y += 14;

    this.drawEnemy(ctx, { type: 'spiny', x: 36, y: y, vx: -0.45, shell: false });
    this.drawText(ctx, 'SPINY', 54, y + 1, MSX.WHITE);
    y += 14;

    this.drawBoss(ctx, { x: 33, y: y - 4, vx: -0.4, hp: 4, maxHp: 4, hurtTimer: 0 });
    this.drawText(ctx, 'FORTRESS BOSS', 54, y + 3, MSX.MED_RED);
    y += 22;

    const theme = this.getTheme();
    this.drawTile(ctx, T.GROUND, 36, y, theme);
    this.drawText(ctx, 'GROUND TILE', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.BRICK, 36, y, theme);
    this.drawText(ctx, 'BRICK BLOCK', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.Q_COIN, 36, y, theme);
    this.drawText(ctx, 'QUESTION BLOCK', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.PIPE_TL, 36, y, theme);
    this.drawText(ctx, 'WARP PIPE', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.VINE, 36, y, theme);
    this.drawText(ctx, 'CLIMB VINE', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.MUSH_CAP_M, 36, y, theme);
    this.drawText(ctx, 'MUSHROOM CAP', 54, y + 1, MSX.GRAY);
    y += 13;

    this.drawTile(ctx, T.LAVA, 36, y, theme);
    this.drawText(ctx, 'LAVA POOL', 54, y + 1, MSX.GRAY);
    y += 22;

    this.drawTextCentered(ctx, '- DIRECTOR -', y, MSX.LIGHT_YELLOW);
    y += 14;
    this.drawTextCentered(ctx, 'HONYANEETA*', y, MSX.WHITE);
    y += 18;
    this.drawTextCentered(ctx, `SCORE: ${String(this.score).padStart(6, '0')}`, y, MSX.CYAN);

    if (this.creditsFinalCard) {
      ctx.fillStyle = MSX.BLACK;
      ctx.fillRect(0, 0, 256, 192);
      ctx.fillStyle = MSX.DARK_BLUE;
      ctx.fillRect(12, 12, 232, 2);
      ctx.fillRect(12, 178, 232, 2);

      this.drawTextCentered(ctx, 'AND YOU.', 84, MSX.LIGHT_YELLOW);
      this.drawTextCentered(ctx, 'THANK YOU!', 98, MSX.CYAN);

      if (this.frame % 40 < 26) {
        this.drawTextCentered(ctx, 'TAP OR PRESS TO TITLE', 142, MSX.LIGHT_GREEN);
      }
    }
  }

  renderGameOverScreen(ctx) {
    ctx.fillStyle = MSX.BLACK;
    ctx.fillRect(0, 0, 256, 192);

    this.drawTextCentered(ctx, 'GAME OVER', 74, MSX.MED_RED);
    this.drawTextCentered(ctx, `FINAL SCORE: ${String(this.score).padStart(6, '0')}`, 98, MSX.WHITE);

    if (this.frame % 40 < 26) {
      this.drawTextCentered(ctx, 'TAP OR PRESS TO TITLE', 128, MSX.CYAN);
    }
  }

  drawText(ctx, text, x, y, color) {
    const FONT = {
      'A': [0x0E,0x11,0x11,0x1F,0x11,0x11,0x11],
      'B': [0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
      'C': [0x0E,0x11,0x10,0x10,0x10,0x11,0x0E],
      'D': [0x1C,0x12,0x11,0x11,0x11,0x12,0x1C],
      'E': [0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F],
      'F': [0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
      'G': [0x0E,0x11,0x10,0x17,0x11,0x11,0x0F],
      'H': [0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
      'I': [0x0E,0x04,0x04,0x04,0x04,0x04,0x0E],
      'K': [0x11,0x12,0x14,0x18,0x14,0x12,0x11],
      'L': [0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
      'M': [0x11,0x1B,0x15,0x15,0x11,0x11,0x11],
      'N': [0x11,0x19,0x15,0x13,0x11,0x11,0x11],
      'O': [0x0E,0x11,0x11,0x11,0x11,0x11,0x0E],

      'U': [0x11,0x11,0x11,0x11,0x11,0x11,0x0E],
      'V': [0x11,0x11,0x11,0x11,0x11,0x0A,0x04],
      'W': [0x11,0x11,0x11,0x15,0x15,0x1B,0x11],
      'X': [0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
      'Y': [0x11,0x11,0x0A,0x04,0x04,0x04,0x04],
      '0': [0x0E,0x11,0x13,0x15,0x19,0x11,0x0E],
      '1': [0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
      '2': [0x0E,0x11,0x01,0x02,0x04,0x08,0x1F],
      '3': [0x1F,0x02,0x04,0x02,0x01,0x11,0x0E],
      '4': [0x02,0x06,0x0A,0x12,0x1F,0x02,0x02],
      '5': [0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
      '6': [0x06,0x08,0x10,0x1E,0x11,0x11,0x0E],
      '7': [0x1F,0x01,0x02,0x04,0x08,0x08,0x08],
      '8': [0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E],
      '9': [0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C],
      ':': [0x00,0x04,0x04,0x00,0x04,0x04,0x00],
      '.': [0x00,0x00,0x00,0x00,0x00,0x00,0x04],
      '-': [0x00,0x00,0x00,0x1F,0x00,0x00,0x00],
      '!': [0x04,0x04,0x04,0x04,0x04,0x00,0x04],
      '%': [0x19,0x1A,0x02,0x04,0x08,0x0B,0x13],
      'x': [0x00,0x00,0x11,0x0A,0x04,0x0A,0x11],
      '*': [0x04,0x15,0x0E,0x1F,0x0E,0x15,0x04],
      ' ': [0x00,0x00,0x00,0x00,0x00,0x00,0x00]
    };

    ctx.fillStyle = color;
    let cx = x;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const glyph = FONT[ch] || FONT[ch.toUpperCase()] || FONT[' '];
      for (let row = 0; row < 7; row++) {
        const bits = glyph[row];
        for (let col = 0; col < 5; col++) {
          if (bits & (1 << (4 - col))) {
            ctx.fillRect(cx + col, y + row, 1, 1);
          }
        }
      }
      cx += 6;
    }
  }

  drawTextCentered(ctx, text, y, color) {
    const w = text.length * 6;
    this.drawText(ctx, text, Math.floor((256 - w) / 2), y, color);
  }
}

window.onload = function () {
  const game = new StickRiseGame();
  let lastTime = performance.now();
  let accumulator = 0;
  const STEP = 1000 / 60;

  function loop(now) {
    accumulator += Math.min(100, now - lastTime);
    lastTime = now;

    while (accumulator >= STEP) {
      game.update();
      accumulator -= STEP;
    }

    game.render();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
};
