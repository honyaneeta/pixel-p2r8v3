    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

  html, body {

    height: 100dvh;
    background-color: #000000;
    color: #FFFFFF;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  #header-bar {
    width: 100%;
    max-width: 768px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: #111111;
    border-bottom: 2px solid #5455ED;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;

    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-pill:active {
    background: #42EBF5;
    color: #000000;
  }

    width: 100vw;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    position: relative;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(84, 85, 237, 0.35);

    #screen-wrap {

      max-width: 100vw;
    }
  }

    #screen-wrap {
      width: auto;
      height: calc(100dvh - 175px);
      max-width: 96vw;
    }

    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000000;

    width: 100%;
    max-width: 768px;
    flex: 1;

    align-items: center;

    width: 122px;
    height: 122px;
    margin-left: 16px;
    border-radius: 50%;
    background: radial-gradient(circle, #1e1e2e 0%, #11111a 75%, #2a2a3e 100%);

    display: flex;
    align-items: center;
    justify-content: center;

  }

    height: 122px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .action-btn {

    height: 66px;

    display: flex;
    flex-direction: column;

    font-size: 18px;

    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 5px 0 rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.4);

    background: radial-gradient(circle at 30% 30%, #E6CE80, #D4524D);

  }
  #btn-a {
    background: radial-gradient(circle at 30% 30%, #5EDC78, #21B03B);
    margin-bottom: 24px;
  }
  .action-btn.active {
    transform: translateY(3px) scale(0.95);

    box-shadow: 0 2px 0 rgba(0,0,0,0.7);
  }
  .btn-sub {

  #pc-hint {
    display: none;
    font-size: 10px;
    color: #CCCCCC;
    text-align: center;

<script>
/**
 * ============================================================================
 * STICK RISE MSX (TMS9918A 256x192 / 16-Color Palette / PSG 3ch+Noise Audio)
 * ============================================================================
 */

// 1. STRICT MSX1 (TMS9918A) 16-COLOR PALETTE
const MSX = {
  BLACK:       '#000000', // 1: Black (also 0: Transparent)
  MED_GREEN:   '#21C842', // 2: Medium Green
  LIGHT_GREEN: '#5EDC78', // 3: Light Green
  DARK_BLUE:   '#5455ED', // 4: Dark Blue
  LIGHT_BLUE:  '#7D76FC', // 5: Light Blue
  DARK_RED:    '#D4524D', // 6: Dark Red
  CYAN:        '#42EBF5', // 7: Cyan
  MED_RED:     '#FC5554', // 8: Medium Red
  LIGHT_RED:   '#FF7978', // 9: Light Red
  DARK_YELLOW: '#D4C154', // 10: Dark Yellow
  LIGHT_YELLOW:'#E6CE80', // 11: Light Yellow
  DARK_GREEN:  '#21B03B', // 12: Dark Green
  MAGENTA:     '#C95BBA', // 13: Magenta
  GRAY:        '#CCCCCC', // 14: Gray
  WHITE:       '#FFFFFF'  // 15: White
};

// 2. WEB AUDIO API PSG (AY-3-8910) 3-CHANNEL SQUARE + LFSR NOISE SYNTHESIZER
class MSXPSG {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.currentTrack = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) {
      this.stopBGM();
    } else if (this.currentTrack) {
      this.playBGM(this.currentTrack);
    }
    return this.muted;
  }

  playTone(freq, duration, vol = 0.075, slideTo = null, delay = 0) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
    }
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

  playNoise(duration, vol = 0.075, delay = 0) {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime + delay;
    const bufferSize = Math.floor(this.ctx.sampleRate * duration);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let lfsr = 0xACE1;
    for (let i = 0; i < bufferSize; i++) {
      if (i % 8 === 0) {
        const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
        lfsr = (lfsr >> 1) | (bit << 15);
      }
      data[i] = ((lfsr & 1) ? 1 : -1) * (1 - i / bufferSize);
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    noise.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start(now);
  }

  sfxJump(isBig) {
    this.playTone(isBig ? 185 : 245, 0.16, 0.075, isBig ? 540 : 680);
  }
  sfxCoin() {
    this.playTone(987.77, 0.065, 0.075, null, 0);
    this.playTone(1318.51, 0.22, 0.075, null, 0.065);
  }
  sfxBump() {
    this.playTone(145, 0.08, 0.085, 65);
  }
  sfxBreak() {
    this.playNoise(0.14, 0.11);
    this.playTone(190, 0.12, 0.075, 55);
  }
  sfxPowerupAppear() {
    const notes = [330, 392, 659, 523, 587, 784];
    notes.forEach((f, i) => this.playTone(f, 0.055, 0.065, null, i * 0.05));
  }
  sfxPowerup() {
    const notes = [261.6, 329.6, 392.0, 523.3, 659.3, 784.0, 1046.5];
    notes.forEach((f, i) => this.playTone(f, 0.065, 0.075, null, i * 0.048));
  }
  sfxShrink() {
    const notes = [587.3, 493.9, 392.0, 329.6, 261.6];
    notes.forEach((f, i) => this.playTone(f, 0.065, 0.075, null, i * 0.052));
  }
  sfxFire() {
    this.playTone(880, 0.07, 0.065, 220);
  }
  sfxStomp() {
    this.playTone(320, 0.085, 0.085, 110);
    this.playNoise(0.055, 0.065);
  }
  sfxKick() {
    this.playTone(420, 0.09, 0.085, 180);
  }
  sfxVine() {
    for (let i = 0; i < 8; i++) {
      this.playTone(220 + i * 55, 0.055, 0.06, null, i * 0.055);
    }
  }
  sfxPipe() {
    for (let i = 0; i < 3; i++) {
      this.playTone(260, 0.06, 0.075, 130, i * 0.095);
    }
  }
  sfxReady() {
    const seq = [
      [523.25, 0.075], [659.25, 0.075], [783.99, 0.075], [1046.50, 0.22]
    ];
    let t = 0;
    seq.forEach(([f, d]) => {
      this.playTone(f, d, 0.07, null, t);
      t += d + 0.02;
    });
  }
  sfxClear() {
    this.stopBGM();
    const seq = [
      [392.0, 0.1], [523.25, 0.1], [659.25, 0.1], [783.99, 0.18],
      [659.25, 0.1], [783.99, 0.35]
    ];
    let t = 0;
    seq.forEach(([f, d]) => {
      this.playTone(f, d, 0.075, null, t);
      t += d + 0.02;
    });
  }
  sfxDie() {
    this.stopBGM();
    const seq = [
      [493.88, 0.1], [698.46, 0.12], [698.46, 0.1], [698.46, 0.1],
      [659.25, 0.1], [587.33, 0.1], [523.25, 0.28]
    ];
    let t = 0;
    seq.forEach(([f, d]) => {
      this.playTone(f, d, 0.075, null, t);
      t += d + 0.02;
    });
  }

  playBGM(track) {
    this.currentTrack = track;
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    if (this.muted || !track) return;

    const tracks = {
      overworld: {
        tempo: 155,
        lead: [659,659,0,659, 0,523,659,0, 784,0,0,0, 392,0,0,0, 523,0,0,392, 0,0,330,0, 440,0,494,0, 466,440,0,0],
        bass: [165,0,165,0, 165,0,165,0, 196,0,196,0, 98,0,98,0, 131,0,131,0, 98,0,82,0, 110,0,123,0, 116,110,0,0]
      },
      underground: {
        tempo: 165,
        lead: [261,523,220,440, 233,466,0,0, 261,523,220,440, 233,466,0,0, 174,349,147,294, 155,311,0,0, 155,147,138,131, 123,116,110,0],
        bass: [131,0,110,0, 116,0,0,0, 131,0,110,0, 116,0,0,0, 87,0,73,0, 78,0,0,0, 78,73,69,65, 62,58,55,0]
      },
      athletic: {
        tempo: 145,
        lead: [523,659,784,659, 880,784,659,523, 587,740,880,740, 987,880,740,587, 659,784,987,784, 1046,987,880,784, 659,587,523,587, 659,0,523,0],
        bass: [131,196,131,196, 131,196,131,196, 147,220,147,220, 147,220,147,220, 165,247,165,247, 131,196,131,196, 165,147,131,147, 131,0,131,0]
      },
      boss: {
        tempo: 135,
        lead: [220,233,220,247, 220,261,220,247, 220,233,220,247, 294,277,261,247, 196,208,196,220, 196,233,196,220, 185,196,208,220, 233,247,261,277],
        bass: [110,110,110,110, 110,110,110,110, 110,110,110,110, 147,138,131,123, 98,98,98,98, 98,98,98,98, 92,98,104,110, 116,123,131,138]
      }
    };

    const data = tracks[track] || tracks.overworld;
    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (this.muted) return;
      const idx = this.bgmStep % data.lead.length;
      const f1 = data.lead[idx];
      const f2 = data.bass[idx];
      if (f1 > 0) this.playTone(f1, (data.tempo / 1000) * 0.85, 0.038);
      if (f2 > 0) this.playTone(f2, (data.tempo / 1000) * 0.85, 0.044);
      if (idx % 4 === 2) this.playNoise(0.028, 0.022);
      this.bgmStep++;
    }, data.tempo);
  }

  stopBGM() {
    if (this.bgmTimer) {
      clearInterval(this.bgmTimer);
      this.bgmTimer = null;
    }
  }
}

const psg = new MSXPSG();

// 3. TILE TYPES & CONSTANTS (32x24 tiles of 8x8 px = 256x192)
const COLS = 32;
const ROWS = 24;
const TILE = 8;

const T = {
  EMPTY: 0,
  GROUND: 1,
  BRICK: 2,
  HARD: 3,
  Q_COIN: 4,
  Q_POWER: 5,
  Q_VINE: 6,
  USED: 7,
  PIPE_TL: 8,
  PIPE_TR: 9,
  PIPE_BL: 10,
  PIPE_BR: 11,
  VINE: 12,
  COIN: 13,
  LAVA: 14,
  MUSH_STEM: 15,
  MUSH_CAP_L: 16,
  MUSH_CAP_M: 17,
  MUSH_CAP_R: 18,
  GOLD_CAP_L: 19,
  GOLD_CAP_M: 20,
  GOLD_CAP_R: 21,
  ONEWAY: 22
};

function isSolidTile(t) {
  return (
    t === T.GROUND || t === T.BRICK || t === T.HARD ||
    t === T.Q_COIN || t === T.Q_POWER || t === T.Q_VINE || t === T.USED ||
    t === T.PIPE_TL || t === T.PIPE_TR || t === T.PIPE_BL || t === T.PIPE_BR
  );
}

function isTopSolidTile(t) {
  return (
    isSolidTile(t) ||
    t === T.MUSH_CAP_L || t === T.MUSH_CAP_M || t === T.MUSH_CAP_R ||
    t === T.GOLD_CAP_L || t === T.GOLD_CAP_M || t === T.GOLD_CAP_R ||
    t === T.ONEWAY
  );
}

function isPassableSpace(t) {
  return t === T.EMPTY || t === T.COIN || t === T.VINE;
}

// 4. 4 ROTATING WORLD THEMES (Overworld -> Underground -> Mushroom -> Fortress Boss)
const THEMES = [
  {
    name: 'OVERWORLD',
    bgm: 'overworld',
    bg: MSX.LIGHT_BLUE,
    groundTop: MSX.MED_GREEN,
    groundBody: MSX.DARK_RED,
    brickMain: MSX.DARK_RED,
    brickLine: MSX.LIGHT_YELLOW,
    hardMain: MSX.GRAY,
    hardDark: MSX.DARK_BLUE,
    pipeLight: MSX.LIGHT_GREEN,
    pipeDark: MSX.DARK_GREEN,
    deco: 'clouds'
  },
  {
    name: 'UNDERGROUND',
    bgm: 'underground',
    bg: MSX.BLACK,
    groundTop: MSX.CYAN,
    groundBody: MSX.DARK_BLUE,
    brickMain: MSX.DARK_BLUE,
    brickLine: MSX.CYAN,
    hardMain: MSX.LIGHT_BLUE,
    hardDark: MSX.DARK_BLUE,
    pipeLight: MSX.CYAN,
    pipeDark: MSX.DARK_BLUE,
    deco: 'crystals'
  },
  {
    name: 'MUSHROOM',
    bgm: 'athletic',
    bg: MSX.DARK_BLUE,
    groundTop: MSX.LIGHT_GREEN,
    groundBody: MSX.DARK_GREEN,
    brickMain: MSX.DARK_YELLOW,
    brickLine: MSX.WHITE,
    hardMain: MSX.LIGHT_YELLOW,
    hardDark: MSX.DARK_YELLOW,
    pipeLight: MSX.LIGHT_YELLOW,
    pipeDark: MSX.DARK_YELLOW,
    deco: 'stars'
  },
  {
    name: 'FORTRESS',
    bgm: 'boss',
    bg: MSX.BLACK,
    groundTop: MSX.GRAY,
    groundBody: MSX.DARK_RED,
    brickMain: MSX.GRAY,
    brickLine: MSX.BLACK,
    hardMain: MSX.WHITE,
    hardDark: MSX.GRAY,
    pipeLight: MSX.MED_RED,
    pipeDark: MSX.DARK_RED,
    deco: 'pillars'
  }
];

// 5. MAIN GAME ENGINE
class StickRiseGame {
  constructor() {
    this.canvas = document.getElementById('msx-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.state = 'TITLE'; // TITLE, READY, PLAYING, DYING, STAGE_CLEAR, GAMEOVER, CREDITS
    this.stateTimer = 0;

    this.stage = 1;
    this.stageSeed = 0;
    this.lives = 3;
    this.score = 0;
    this.coins = 0;
    this.highScore = this.loadHighScore();
    this.highStage = this.loadHighStage();
    this.powerState = 0; // 0: Small, 1: Super, 2: Fire
    this.stompCombo = 0;
    this.combo1UpCount = 0;
    this.frame = 0;

    this.creditsUnlocked = false;
    this.creditsScrollY = 192;
    this.creditsFinalCard = false;
    this.creditsFinalTimer = 0;
    this.creditsCanRetry = false;

    this.grid = [];
    this.bouncingBlocks = []; // { r, c, timer, maxTimer }
    this.lifts = [];
    this.enemies = [];
    this.items = [];
    this.fireballs = [];
    this.enemyFires = [];
    this.particles = [];
    this.popups = [];
    this.vinesGrowing = [];
    this.pipes = [];
    this.goal = { x: 20, y: 4, baseY: 32, reached: false, flagY: 6 };
    this.boss = null;

    this.player = {
      x: 16, y: 170,
      vx: 0, vy: 0,
      w: 6, h: 8,
      dir: 1,
      onGround: false,
      coyoteTimer: 0,
      crouching: false,
      onVine: false,
      invuln: 0,
      shrinkAnim: 0,
      animFrame: 0,
      jumpHeld: false,
      fireCooldown: 0,
      pipeCooldown: 0
    };

    this.input = {
      left: false,
      right: false,
      up: false,
      down: false,
      dash: false,
      a: false,
      aJustPressed: false,
      b: false,
      bJustPressed: false
    };

    this.bindInputs();
  }

  getTheme() {
    return THEMES[(this.stage - 1) % THEMES.length];
  }

  loadHighScore() {
    try {
      const v = parseInt(localStorage.getItem('stick_rise_msx_highscore') || '0', 10);
      return Number.isFinite(v) && v > 0 ? v : 0;
    } catch (_) {
      return 0;
    }
  }

  loadHighStage() {
    try {
      const v = parseInt(localStorage.getItem('stick_rise_msx_highstage') || '1', 10);
      return Number.isFinite(v) && v >= 1 ? v : 1;
    } catch (_) {
      return 1;
    }
  }

  saveHighRecords() {
    try {
      localStorage.setItem('stick_rise_msx_highscore', String(this.highScore));
      localStorage.setItem('stick_rise_msx_highstage', String(this.highStage));
    } catch (_) {}
  }

  updateHighRecords() {
    let changed = false;
    if (this.score > this.highScore) {
      this.highScore = this.score;
      changed = true;
    }
    if (this.stage > this.highStage) {
      this.highStage = this.stage;
      changed = true;
    }
    if (changed) {
      this.saveHighRecords();
    }
  }

  formatStageLabel(stageNum) {
    const worldNum = Math.floor((stageNum - 1) / 4) + 1;
    const subNum = ((stageNum - 1) % 4) + 1;
    return `${worldNum}-${subNum}`;
  }

  returnToTitle() {
    this.updateHighRecords();
    psg.stopBGM();
    this.state = 'TITLE';
    this.creditsFinalCard = false;
    this.creditsCanRetry = false;
  }

  generateNewStageSeed() {
    this.stageSeed = (Math.floor(Math.random() * 0xFFFFFFFF) ^ (Date.now() & 0xFFFFFFFF)) >>> 0;
  }

  startNewGame() {
    psg.init();
    this.stage = 1;
    this.generateNewStageSeed();
    this.lives = 3;
    this.score = 0;
    this.coins = 0;
    this.highScore = this.loadHighScore();
    this.highStage = this.loadHighStage();
    this.powerState = 0;
    this.stompCombo = 0;
    this.combo1UpCount = 0;
    this.creditsUnlocked = false;
    this.creditsScrollY = 192;
    this.creditsFinalCard = false;
    this.creditsFinalTimer = 0;
    this.creditsCanRetry = false;
    this.enterReadyScreen();
  }

  enterReadyScreen() {
    this.state = 'READY';
    this.stateTimer = 95;
    psg.stopBGM();
    psg.sfxReady();
  }

  beginStage() {
    this.stompCombo = 0;
    this.buildStage(this.stage);
    this.state = 'PLAYING';
    psg.playBGM(this.getTheme().bgm);
  }

  // ==========================================================================
  // PROCEDURAL MULTI-TIERED STAGE GENERATOR (FIXED SEED PER STAGE ATTEMPTS)
  // ==========================================================================
  buildStage(stageNum) {
    const themeIdx = (stageNum - 1) % 4;
    const isBossStage = (themeIdx === 3);

    this.grid = Array.from({ length: ROWS }, () => Array(COLS).fill(T.EMPTY));
    this.bouncingBlocks = [];
    this.lifts = [];
    this.enemies = [];
    this.items = [];
    this.fireballs = [];
    this.enemyFires = [];
    this.particles = [];
    this.popups = [];
    this.vinesGrowing = [];
    this.pipes = [];
    this.boss = null;

    let s = ((stageNum * 2654435761) ^ this.stageSeed) >>> 0;
    const rng = () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const randInt = (min, max) => Math.floor(rng() * (max - min + 1)) + min;
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];

    const archetype = (stageNum + randInt(0, 2)) % 4;

    const buildPlatform = (cStart, cEnd, rTop, style = 'normal') => {
      const start = Math.max(0, cStart);
      const end = Math.min(COLS - 1, cEnd);
      if (start > end) return;
      if (style === 'mushroom') {
        const mid = Math.floor((start + end) / 2);
        for (let r = rTop + 1; r <= 21; r++) {
          if (this.grid[r][mid] === T.EMPTY) this.grid[r][mid] = T.MUSH_STEM;
          if (end - start >= 5 && this.grid[r][mid + 1] === T.EMPTY) this.grid[r][mid + 1] = T.MUSH_STEM;
        }
        for (let c = start; c <= end; c++) {
          this.grid[rTop][c] = (c === start) ? T.MUSH_CAP_L : (c === end ? T.MUSH_CAP_R : T.MUSH_CAP_M);
        }
      } else if (style === 'gold_mush') {
        const mid = Math.floor((start + end) / 2);
        for (let r = rTop + 1; r <= 21; r++) {
          if (this.grid[r][mid] === T.EMPTY) this.grid[r][mid] = T.MUSH_STEM;
        }
        for (let c = start; c <= end; c++) {
          this.grid[rTop][c] = (c === start) ? T.GOLD_CAP_L : (c === end ? T.GOLD_CAP_R : T.GOLD_CAP_M);
        }
      } else if (style === 'oneway') {
        for (let c = start; c <= end; c++) {
          this.grid[rTop][c] = T.ONEWAY;
        }
      } else {
        for (let c = start; c <= end; c++) {
          this.grid[rTop][c] = (style === 'hard') ? T.HARD : T.GROUND;
        }
      }
    };

    const placeBlockCluster = (cStart, len, rBlock, includeVine = false) => {
      const vineIdx = includeVine ? randInt(0, len - 1) : -1;
      for (let i = 0; i < len; i++) {
        const c = cStart + i;
        if (c < 1 || c >= COLS - 1) continue;
        if (i === vineIdx) {
          this.grid[rBlock][c] = T.Q_VINE;
        } else {
          const roll = rng();
          if (roll < 0.25) this.grid[rBlock][c] = T.Q_POWER;
          else if (roll < 0.55) this.grid[rBlock][c] = T.Q_COIN;
          else this.grid[rBlock][c] = T.BRICK;
        }
      }
    };

    const placeCoinArc = (cStart, len, rBase) => {
      for (let i = 0; i < len; i++) {
        const c = cStart + i;
        const arc = (i > 0 && i < len - 1) ? -1 : 0;
        const r = Math.max(1, rBase + arc);
        if (c >= 1 && c < COLS - 1 && this.grid[r][c] === T.EMPTY) {
          this.grid[r][c] = T.COIN;
        }
      }
    };

    const numPits = isBossStage ? randInt(2, 3) : randInt(1, 2);
    const pits = [];
    let cursor = randInt(7, 10);
    for (let i = 0; i < numPits; i++) {
      const w = randInt(2, 3);
      if (cursor + w < 25) {
        pits.push([cursor, cursor + w - 1]);
        cursor += w + randInt(5, 8);
      }
    }

    for (let c = 0; c < COLS; c++) {
      const inPit = pits.some(([p1, p2]) => c >= p1 && c <= p2);
      if (inPit) {
        this.grid[22][c] = isBossStage ? T.LAVA : T.EMPTY;
        this.grid[23][c] = isBossStage ? T.LAVA : T.EMPTY;
      } else {
        this.grid[22][c] = T.GROUND;
        this.grid[23][c] = T.GROUND;
      }
    }

    const stepCol = randInt(14, 21);
    const stepW = randInt(3, 5);
    if (!pits.some(([p1, p2]) => stepCol <= p2 + 1 && stepCol + stepW >= p1 - 1)) {
      for (let c = stepCol; c < stepCol + stepW; c++) {
        this.grid[21][c] = T.GROUND;
      }
    }

    const t1ClusterCol = randInt(4, 9);
    placeBlockCluster(t1ClusterCol, randInt(3, 4), 18, false);
    placeCoinArc(randInt(13, 19), randInt(3, 5), 20);

    const platStyle2 = (themeIdx === 2) ? 'mushroom' : (themeIdx === 3 ? 'hard' : 'ground');
    const platStyle3 = (themeIdx === 2) ? 'gold_mush' : (themeIdx === 3 ? 'hard' : 'ground');

    let pipeInCol = 27;
    let pipeOutCol = 4;
    let pipeOutRow = 13;
    let t2MainStart = 2, t2MainEnd = 22;
    let t3MainStart = 8, t3MainEnd = 28;
    let liftX = 4 * 8, liftMinY = 6 * 8, liftMaxY = 14 * 8;

    if (archetype === 0) {
      t2MainStart = randInt(1, 3);
      t2MainEnd = randInt(19, 23);
      buildPlatform(t2MainStart, t2MainEnd, randInt(16, 17), platStyle2);
      buildPlatform(26, 30, 17, 'oneway');

      pipeInCol = randInt(26, 28);
      pipeOutCol = t2MainStart + randInt(2, 4);
      pipeOutRow = 13;

      t3MainStart = randInt(9, 12);
      t3MainEnd = randInt(28, 30);
      buildPlatform(t3MainStart, t3MainEnd, randInt(9, 10), platStyle3);
      buildPlatform(1, 5, 11, 'oneway');

      liftX = randInt(5, 7) * 8;
      liftMinY = 6 * 8;
      liftMaxY = 14 * 8;
    } else if (archetype === 1) {
      t2MainStart = randInt(9, 12);
      t2MainEnd = randInt(29, 30);
      buildPlatform(t2MainStart, t2MainEnd, randInt(16, 17), platStyle2);
      buildPlatform(1, 5, 17, 'oneway');

      pipeInCol = randInt(25, 28);
      pipeOutCol = t2MainEnd - randInt(4, 6);
      pipeOutRow = 13;

      t3MainStart = randInt(1, 3);
      t3MainEnd = randInt(20, 23);
      buildPlatform(t3MainStart, t3MainEnd, randInt(9, 10), platStyle3);
      buildPlatform(26, 30, 11, 'oneway');

      liftX = randInt(23, 25) * 8;
      liftMinY = 6 * 8;
      liftMaxY = 14 * 8;
    } else if (archetype === 2) {
      const leftEnd = randInt(11, 13);
      const rightStart = randInt(18, 20);
      buildPlatform(1, leftEnd, 16, platStyle2);
      buildPlatform(rightStart, 30, 16, platStyle2);
      buildPlatform(leftEnd + 2, rightStart - 2, 14, 'oneway');

      t2MainStart = 1;
      t2MainEnd = leftEnd;
      pipeInCol = randInt(26, 28);
      pipeOutCol = randInt(3, 5);
      pipeOutRow = 13;

      const t3LeftEnd = randInt(9, 11);
      const t3RightStart = randInt(19, 21);
      buildPlatform(2, t3LeftEnd, 9, platStyle3);
      buildPlatform(t3RightStart, 29, 9, platStyle3);
      buildPlatform(t3LeftEnd + 2, t3RightStart - 2, 10, 'oneway');

      t3MainStart = t3RightStart;
      t3MainEnd = 29;
      liftX = randInt(14, 16) * 8;
      liftMinY = 5 * 8;
      liftMaxY = 13 * 8;
    } else {
      t2MainStart = randInt(6, 8);
      t2MainEnd = randInt(23, 25);
      buildPlatform(t2MainStart, t2MainEnd, 16, platStyle2);
      buildPlatform(0, 3, 17, 'oneway');
      buildPlatform(28, 31, 17, 'oneway');

      pipeInCol = randInt(26, 28);
      pipeOutCol = t2MainStart + randInt(2, 4);
      pipeOutRow = 13;

      buildPlatform(11, 20, 9, platStyle3);
      buildPlatform(3, 8, 10, 'oneway');
      buildPlatform(23, 28, 10, 'oneway');
      t3MainStart = 11;
      t3MainEnd = 20;

      liftX = (rng() < 0.5 ? 2 : 27) * 8;
      liftMinY = 5 * 8;
      liftMaxY = 14 * 8;
    }

    while (
      pipeInCol > 6 &&
      (!isSolidTile(this.grid[22][pipeInCol]) || !isSolidTile(this.grid[22][pipeInCol + 1]))
    ) {
      pipeInCol--;
    }
    this.grid[22][pipeInCol] = T.GROUND;
    this.grid[22][pipeInCol + 1] = T.GROUND;
    this.grid[23][pipeInCol] = T.GROUND;
    this.grid[23][pipeInCol + 1] = T.GROUND;
    if (this.grid[21][pipeInCol] === T.GROUND) this.grid[21][pipeInCol] = T.EMPTY;
    if (this.grid[21][pipeInCol + 1] === T.GROUND) this.grid[21][pipeInCol + 1] = T.EMPTY;

    let supportRow = pipeOutRow + 3;
    while (supportRow < 22 && !isTopSolidTile(this.grid[supportRow][pipeOutCol]) && !isTopSolidTile(this.grid[supportRow][pipeOutCol + 1])) {
      supportRow++;
    }
    if (supportRow >= 22) {
      supportRow = 16;
      buildPlatform(Math.max(1, pipeOutCol - 1), Math.min(COLS - 2, pipeOutCol + 2), supportRow, platStyle2);
    } else {
      if (!isTopSolidTile(this.grid[supportRow][pipeOutCol])) {
        this.grid[supportRow][pipeOutCol] = (themeIdx === 3) ? T.HARD : T.GROUND;
      }
      if (!isTopSolidTile(this.grid[supportRow][pipeOutCol + 1])) {
        this.grid[supportRow][pipeOutCol + 1] = (themeIdx === 3) ? T.HARD : T.GROUND;
      }
    }
    const actualOutPipeHeight = Math.max(2, supportRow - pipeOutRow);

    this.placePipe(pipeInCol, 20, 2);
    this.placePipe(pipeOutCol, pipeOutRow, actualOutPipeHeight);
    this.pipes.push({
      inX: pipeInCol * 8 + 4, inY: 20 * 8,
      outX: pipeOutCol * 8 + 4, outY: pipeOutRow * 8
    });

    const summitOnLeft = (archetype === 0 || archetype === 2) ? (rng() < 0.75) : (rng() < 0.25);
    let goalCol = 3;

    if (summitOnLeft) {
      const summitEnd = randInt(19, 23);
      buildPlatform(0, summitEnd, 4, 'hard');
      goalCol = randInt(2, 4);
      placeCoinArc(randInt(10, 15), 4, 3);
    } else {
      const summitStart = randInt(8, 12);
      buildPlatform(summitStart, 31, 4, 'hard');
      goalCol = randInt(27, 29);
      placeCoinArc(randInt(14, 19), 4, 3);
    }

    // Progressive lift placement & ceiling hazard scaling across stages 1..32
    const progress = Math.min(1, Math.max(0, (stageNum - 1) / 31));
    const fullChaos = stageNum >= 28;
    const baseSpeed = 0.26 + Math.min(0.64, progress * 0.52 + (fullChaos ? 0.14 : 0));

    const goalX = goalCol * TILE;
    const isNearGoalOrSummit = (lx, lw) => {
      const lCenter = lx + lw / 2;
      if (Math.abs(lCenter - goalX) < 104) return true;
      if (summitOnLeft && lx < 15 * TILE) return true;
      if (!summitOnLeft && lx + lw > 17 * TILE) return true;
      return false;
    };

    const spawnLiftProb = (stageNum <= 2) ? 0.65 : (0.58 + progress * 0.22);
    if (rng() < spawnLiftProb) {
      // Lift width shrinks progressively: 28px (Stage 1-4) -> 24px (Stage 5-15) -> 20px (Stage 16+)
      let liftW = 24;
      if (stageNum <= 4) {
        liftW = 28;
      } else if (stageNum >= 16) {
        liftW = (fullChaos || rng() < 0.35 + (stageNum - 16) * 0.04) ? 20 : 24;
      }

      const safeMinCol = summitOnLeft ? 16 : 2;
      const safeMaxCol = summitOnLeft ? 28 : 13;
      let chosenLiftX = Math.max(safeMinCol * TILE, Math.min(safeMaxCol * TILE, liftX));
      if (isNearGoalOrSummit(chosenLiftX, liftW)) {
        chosenLiftX = randInt(safeMinCol, safeMaxCol) * TILE;
      }

      // Vertical travel range expands gently with stage progression
      const minRowBound = (stageNum <= 4) ? 10 : 9;
      const cappedMinY = Math.max(minRowBound * TILE, liftMinY);
      const extraRange = Math.round(progress * 2) * TILE;
      const cappedMaxY = Math.max(cappedMinY + 24, Math.min(19 * TILE, liftMaxY + extraRange));

      this.lifts.push({
        x: chosenLiftX,
        y: Math.floor((cappedMinY + cappedMaxY) / 2),
        w: liftW,
        h: 4,
        minY: cappedMinY,
        maxY: cappedMaxY,
        vy: (rng() < 0.5 ? -1 : 1) * baseSpeed
      });

      // Second lift appears starting at stage 9, scaling probability and speed up to stage 32
      const secondLiftProb = stageNum < 9 ? 0 : Math.min(0.68, 0.18 + ((stageNum - 9) / 23) * 0.50);
      if (rng() < secondLiftProb) {
        const altW = (stageNum >= 20 && (fullChaos || rng() < 0.5)) ? 20 : 24;
        const altLiftX = randInt(safeMinCol, safeMaxCol) * TILE;
        if (Math.abs(altLiftX - chosenLiftX) >= 32 && !isNearGoalOrSummit(altLiftX, altW)) {
          const altMinY = 9 * TILE;
          const altMaxY = 18 * TILE;
          const altSpeed = baseSpeed * (1.05 + progress * 0.15);
          this.lifts.push({
            x: altLiftX,
            y: Math.floor((altMinY + altMaxY) / 2),
            w: altW,
            h: 4,
            minY: altMinY,
            maxY: altMaxY,
            vy: (rng() < 0.5 ? -1 : 1) * altSpeed
          });
        }
      }
    }

    let t2BlockCol = Math.max(2, Math.min(COLS - 6, Math.floor((t2MainStart + t2MainEnd) / 2) - 1));
    const candidateVineCols = [];
    for (let c = Math.max(2, t2MainStart + 1); c <= Math.min(COLS - 4, t2MainEnd - 1); c++) {
      let hasUpperFloor = false;
      for (let ur = 4; ur <= 10; ur++) {
        if (isTopSolidTile(this.grid[ur][c])) {
          hasUpperFloor = true;
          break;
        }
      }
      if (hasUpperFloor) candidateVineCols.push(c);
    }
    if (candidateVineCols.length > 0) {
      const chosenVineCol = pick(candidateVineCols);
      t2BlockCol = Math.max(2, Math.min(COLS - 4, chosenVineCol - 1));
      for (let i = 0; i < 3; i++) {
        const c = t2BlockCol + i;
        if (c === chosenVineCol) {
          this.grid[11][c] = T.Q_VINE;
        } else {
          const roll = rng();
          if (roll < 0.35) this.grid[11][c] = T.Q_POWER;
          else if (roll < 0.70) this.grid[11][c] = T.Q_COIN;
          else this.grid[11][c] = T.BRICK;
        }
      }
    } else {
      placeBlockCluster(t2BlockCol, 3, 11, true);
    }

    const t3BlockCol = Math.max(2, Math.min(COLS - 5, Math.floor((t3MainStart + t3MainEnd) / 2) - 1));
    placeBlockCluster(t3BlockCol, 3, 5, false);

    // Progressive ceiling crush hazards above lifts (starts gently at stage 5, intensifies toward stage 32)
    if (stageNum >= 5) {
      const patternChance = fullChaos ? 0.90 : Math.min(0.80, 0.22 + ((stageNum - 5) / 23) * 0.58);
      for (const lift of this.lifts) {
        if (rng() < patternChance) {
          const lcStart = Math.max(2, Math.floor(lift.x / TILE));
          const lcEnd = Math.min(COLS - 3, Math.floor((lift.x + lift.w - 1) / TILE));
          // Clearance between lift's highest point and ceiling tightens progressively (34px -> 16px)
          const minGapPx = fullChaos ? 16 : Math.round(34 - progress * 18);
          const ceilRow = Math.max(2, Math.floor((lift.minY - minGapPx) / TILE) - 1);
          if (ceilRow >= 2 && ceilRow <= 12) {
            // Early ceiling traps only cover partial width of the lift; later stages cover full width + overhang
            const span = lcEnd - lcStart + 1;
            let cFrom = lcStart;
            let cTo = lcEnd;
            if (stageNum < 12 && span >= 3) {
              if (rng() < 0.5) cTo = lcEnd - 1;
              else cFrom = lcStart + 1;
            } else if (stageNum >= 18) {
              cFrom = Math.max(1, lcStart - 1);
              cTo = Math.min(COLS - 2, lcEnd + 1);
            }
            for (let c = cFrom; c <= cTo; c++) {
              if (this.grid[ceilRow][c] === T.EMPTY && !this.isPipeOrPipeSupport(ceilRow, c)) {
                this.grid[ceilRow][c] = (themeIdx === 3 || stageNum >= 20) ? T.HARD : T.BRICK;
              }
            }
          }
        }
      }
    }

    this.goal = {
      x: goalCol * 8,
      y: 0 * 8 + 2,
      baseY: 4 * 8,
      reached: false,
      flagY: 0 * 8 + 4
    };

    const hasFloorAbove = (col, fromRow) => {
      let foundFloor = false;
      for (let ur = 2; ur < fromRow; ur++) {
        const st = this.grid[ur][col];
        if (st === T.PIPE_TL || st === T.PIPE_TR || st === T.PIPE_BL || st === T.PIPE_BR) return false;
        if (isTopSolidTile(st)) foundFloor = true;
      }
      return foundFloor;
    };
    for (let r = 6; r < ROWS; r++) {
      for (let c = 1; c < COLS - 1; c++) {
        if (this.grid[r][c] === T.Q_VINE && !hasFloorAbove(c, r)) {
          let swapped = false;
          for (const dc of [-1, 1, -2, 2]) {
            const nc = c + dc;
            if (nc >= 1 && nc < COLS - 1 && hasFloorAbove(nc, r)) {
              const adj = this.grid[r][nc];
              if (adj === T.Q_COIN || adj === T.Q_POWER || adj === T.BRICK) {
                this.grid[r][c] = adj;
                this.grid[r][nc] = T.Q_VINE;
                swapped = true;
                break;
              }
            }
          }
          if (!swapped) {
            const ledgeRow = Math.max(5, r - 5);
            for (let lc = Math.max(1, c - 1); lc <= Math.min(COLS - 2, c + 1); lc++) {
              if (this.grid[ledgeRow][lc] === T.EMPTY) {
                this.grid[ledgeRow][lc] = T.ONEWAY;
              }
            }
          }
        }
      }
    }

    this.ensureLiftsClearOfTerrain();
    this.enforceBigPlayerClearance();
    this.guaranteeStageClearable();

    const floorTile = (themeIdx === 3) ? T.HARD : T.GROUND;
    for (const pipe of this.pipes) {
      const pairs = [
        [Math.floor((pipe.inX - 4) / TILE), Math.floor(pipe.inY / TILE)],
        [Math.floor((pipe.outX - 4) / TILE), Math.floor(pipe.outY / TILE)]
      ];
      for (const [pc, topR] of pairs) {
        this.grid[topR][pc] = T.PIPE_TL;
        this.grid[topR][pc + 1] = T.PIPE_TR;
        let r = topR + 1;
        while (r < ROWS && (this.grid[r][pc] === T.PIPE_BL || this.grid[r][pc + 1] === T.PIPE_BR || !isTopSolidTile(this.grid[r][pc]) || !isTopSolidTile(this.grid[r][pc + 1]))) {
          if (r >= 22) break;
          if (r > topR + 1 && isTopSolidTile(this.grid[r][pc]) && isTopSolidTile(this.grid[r][pc + 1]) &&
              this.grid[r][pc] !== T.PIPE_BL && this.grid[r][pc + 1] !== T.PIPE_BR) {
            break;
          }
          this.grid[r][pc] = T.PIPE_BL;
          this.grid[r][pc + 1] = T.PIPE_BR;
          r++;
        }
        if (r < ROWS) {
          if (!isTopSolidTile(this.grid[r][pc]) || this.grid[r][pc] === T.PIPE_BL) this.grid[r][pc] = floorTile;
          if (!isTopSolidTile(this.grid[r][pc + 1]) || this.grid[r][pc + 1] === T.PIPE_BR) this.grid[r][pc + 1] = floorTile;
        }
      }
    }

    const allowSpiny = (stageNum > 16) || (stageNum % 4 === 0);
    const enemyTypes = allowSpiny ? ['goomba', 'koopa', 'spiny'] : ['goomba', 'koopa'];
    const numEnemies = Math.min(7, 3 + Math.floor(stageNum / 2));
    const candidateRows = [21, 15, 16, 8, 9];

    for (let i = 0; i < numEnemies; i++) {
      const eType = enemyTypes[Math.floor(rng() * enemyTypes.length)];
      let placed = false;

      for (let attempt = 0; attempt < 25 && !placed; attempt++) {
        const r = pick(candidateRows);
        const c = randInt(5, COLS - 4);
        if (
          r + 1 < ROWS &&
          isPassableSpace(this.grid[r][c]) &&
          isTopSolidTile(this.grid[r + 1][c]) &&
          !(r >= 19 && c <= 6)
        ) {
          let minC = c;
          let maxC = c;
          while (minC > 1 && isPassableSpace(this.grid[r][minC - 1]) && isTopSolidTile(this.grid[r + 1][minC - 1])) {
            minC--;
          }
          while (maxC < COLS - 2 && isPassableSpace(this.grid[r][maxC + 1]) && isTopSolidTile(this.grid[r + 1][maxC + 1])) {
            maxC++;
          }
          if (maxC - minC >= 2) {
            this.enemies.push(this.createEnemy(eType, c * 8, r * 8, minC, maxC));
            placed = true;
          }
        }
      }
    }

    if (isBossStage) {
      const bossX = summitOnLeft ? randInt(9, 13) * 8 : randInt(16, 20) * 8;
      const bossMinX = summitOnLeft ? 6 * 8 : 12 * 8;
      const bossMaxX = summitOnLeft ? 17 * 8 : 24 * 8;
      this.boss = {
        x: bossX,
        y: 2 * 8,
        w: 14,
        h: 16,
        vx: (summitOnLeft ? 1 : -1) * (0.35 + stageNum * 0.03),
        vy: 0,
        hp: 4 + Math.floor(stageNum / 2) * 2,
        maxHp: 4 + Math.floor(stageNum / 2) * 2,
        minX: bossMinX,
        maxX: bossMaxX,
        fireTimer: 80,
        hurtTimer: 0
      };
    }

    this.player.x = 12;
    this.player.y = 21 * 8;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.dir = 1;
    this.player.onGround = true;
    this.player.coyoteTimer = 0;
    this.player.crouching = false;
    this.player.onVine = false;
    this.player.invuln = 45;
    this.player.shrinkAnim = 0;
    this.player.pipeCooldown = 0;
    this.updatePlayerHitbox();
  }

  placePipe(col, topRow, height) {
    if (col < 0 || col + 1 >= COLS) return;
    this.grid[topRow][col] = T.PIPE_TL;
    this.grid[topRow][col + 1] = T.PIPE_TR;
    for (let r = topRow + 1; r < topRow + height; r++) {
      if (r < ROWS) {
        this.grid[r][col] = T.PIPE_BL;
        this.grid[r][col + 1] = T.PIPE_BR;
      }
    }
  }

  isPipeOrPipeSupport(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
    const t = this.grid[r][c];
    if (t === T.PIPE_TL || t === T.PIPE_TR || t === T.PIPE_BL || t === T.PIPE_BR) return true;
    if (r > 0) {
      const above = this.grid[r - 1][c];
      if (above === T.PIPE_BL || above === T.PIPE_BR || above === T.PIPE_TL || above === T.PIPE_TR) return true;
    }
    return false;
  }

  ensureLiftsClearOfTerrain() {
    const stageNum = this.stage || 1;
    const fullChaos = stageNum >= 28;
    const progress = Math.min(1, Math.max(0, (stageNum - 1) / 31));
    const minClearance = fullChaos ? 16 : Math.round(34 - progress * 18);
    const turnaroundPad = fullChaos ? 2 : Math.round(10 - progress * 8);

    for (const lift of this.lifts) {
      const overlapsPipeCol = (lx) => {
        const c1 = Math.max(0, Math.floor((lx - 8) / TILE));
        const c2 = Math.min(COLS - 1, Math.floor((lx + lift.w + 7) / TILE));
        for (let c = c1; c <= c2; c++) {
          for (let r = 0; r < ROWS; r++) {
            const t = this.grid[r][c];
            if (t === T.PIPE_TL || t === T.PIPE_TR || t === T.PIPE_BL || t === T.PIPE_BR) return true;
          }
        }
        return false;
      };
      if (overlapsPipeCol(lift.x)) {
        for (let offset = 8; offset <= 128; offset += 8) {
          if (lift.x + offset + lift.w <= 248 && !overlapsPipeCol(lift.x + offset)) {
            lift.x += offset;
            break;
          }
          if (lift.x - offset >= 8 && !overlapsPipeCol(lift.x - offset)) {
            lift.x -= offset;
            break;
          }
        }
      }

      const cStart = Math.max(0, Math.floor((lift.x - 1) / TILE));
      const cEnd = Math.min(COLS - 1, Math.floor((lift.x + lift.w) / TILE));
      const rTop = Math.max(1, Math.floor((lift.minY - 8) / TILE));
      const rBot = Math.min(21, Math.floor((lift.maxY + lift.h + 2) / TILE));

      for (let r = rTop; r <= rBot; r++) {
        for (let c = cStart; c <= cEnd; c++) {
          const t = this.grid[r][c];
          if (t !== T.EMPTY && t !== T.COIN && t !== T.VINE) {
            if (this.isPipeOrPipeSupport(r, c)) {
              if (r * TILE <= lift.y) {
                lift.minY = Math.max(lift.minY, (r + 1) * TILE + 2);
              } else {
                lift.maxY = Math.min(lift.maxY, r * TILE - lift.h - 2);
              }
            } else {
              this.grid[r][c] = T.EMPTY;
            }
          }
        }
      }

      // Early stages (<= 6): eliminate ceiling obstacles above lift's top turnaround & keep generous gap
      // Stages 7..28: gradually introduce ceiling/overhang patterns with safe clearance
      // Stage 29+: full difficulty patterns
      const rScanTop = (stageNum <= 4) ? 1 : Math.max(1, Math.floor((lift.minY - minClearance - 8) / TILE));
      const rScanBot = Math.min(21, Math.floor((lift.minY + 4) / TILE));
      for (let r = rScanTop; r <= rScanBot; r++) {
        for (let c = cStart; c <= cEnd; c++) {
          const t = this.grid[r][c];
          if (t !== T.EMPTY && t !== T.COIN && t !== T.VINE && !this.isPipeOrPipeSupport(r, c)) {
            if (stageNum <= 4) {
              this.grid[r][c] = T.EMPTY;
            } else {
              const tileBottomY = (r + 1) * TILE;
              if (tileBottomY > lift.minY - minClearance && tileBottomY <= lift.minY + 8) {
                if (stageNum < 28 && Math.random() > progress * 0.80) {
                  this.grid[r][c] = T.EMPTY;
                } else {
                  lift.minY = Math.min(lift.maxY - 12, Math.max(lift.minY, tileBottomY + minClearance));
                }
              }
            }
          }
        }
      }

      lift.minY = Math.max(9 * TILE, 2 * TILE + turnaroundPad, lift.minY);
      lift.maxY = Math.min(21 * TILE - lift.h - turnaroundPad, lift.maxY);

      if (lift.maxY < lift.minY + 14) {
        lift.maxY = Math.min(21 * TILE - lift.h - 2, lift.minY + 14);
      }
      lift.y = Math.max(lift.minY, Math.min(lift.maxY, lift.y));
    }
  }

  enforceBigPlayerClearance() {
    for (let r = 2; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const tile = this.grid[r][c];
        if (isTopSolidTile(tile)) {
          if (r - 1 >= 0 && isPassableSpace(this.grid[r - 1][c])) {
            if (r - 2 >= 0 && isSolidTile(this.grid[r - 2][c]) && !this.isPipeOrPipeSupport(r - 2, c)) {
              this.grid[r - 2][c] = T.EMPTY;
            }
          }
        }
      }
    }
    for (let c = 1; c < COLS - 1; c++) {
      const b18 = this.grid[18][c];
      if (b18 === T.BRICK || b18 === T.Q_COIN || b18 === T.Q_POWER || b18 === T.Q_VINE) {
        if (!this.isPipeOrPipeSupport(17, c) && this.grid[17][c] !== T.EMPTY) {
          this.grid[17][c] = T.EMPTY;
        }
      }
    }
  }

  guaranteeStageClearable() {
    const canStandAt = (r, c, isBig) => {
      if (r < 1 || r >= ROWS || c < 0 || c >= COLS) return false;
      if (!isTopSolidTile(this.grid[r][c])) return false;
      if (!isPassableSpace(this.grid[r - 1][c])) return false;
      if (isBig) {
        if (r - 2 >= 0 && !isPassableSpace(this.grid[r - 2][c])) {
          const leftExit = (c - 1 >= 0 && isPassableSpace(this.grid[r - 1][c - 1]));
          const rightExit = (c + 1 < COLS && isPassableSpace(this.grid[r - 1][c + 1]));
          if (!leftExit && !rightExit) return false;
        }
      }
      return true;
    };

    const getFlatRunway = (r, c, dir) => {
      let len = 1;
      for (let step = 1; step <= 5; step++) {
        const cc = c - dir * step;
        if (cc < 0 || cc >= COLS) break;
        if (!isTopSolidTile(this.grid[r][cc])) break;
        if (!isPassableSpace(this.grid[r - 1][cc])) break;
        len++;
      }
      return len;
    };

    const isLineOfSightClear = (rFrom, cFrom, rTo, cTo, isBig) => {
      const minC = Math.min(cFrom, cTo);
      const maxC = Math.max(cFrom, cTo);
      const minR = Math.min(rFrom, rTo) - 1;
      const maxR = Math.max(rFrom, rTo) - 1;
      for (let c = minC; c <= maxC; c++) {
        for (let r = Math.max(1, minR); r <= Math.min(ROWS - 1, maxR); r++) {
          if (isSolidTile(this.grid[r][c])) {
            if (isBig && r === minR && rFrom === rTo && isPassableSpace(this.grid[rFrom - 1][c])) {
              continue;
            }
            return false;
          }
        }
      }
      return true;
    };

    const computeReachable = (isBig) => {
      const visited = new Set();
      const queue = [];
      const key = (r, c) => `${r},${c}`;

      for (let c = 1; c <= 3; c++) {
        if (canStandAt(22, c, isBig)) {
          visited.add(key(22, c));
          queue.push([22, c]);
        }
      }

      const goalCol = Math.floor(this.goal.x / TILE);
      const goalRow = Math.floor(this.goal.baseY / TILE);
      let goalReached = false;

      while (queue.length > 0) {
        const [r, c] = queue.shift();

        if (Math.abs(c - goalCol) <= 2 && Math.abs(r - goalRow) <= 4) {
          goalReached = true;
        }

        for (const dir of [-1, 1]) {
          const nc = c + dir;
          if (nc < 0 || nc >= COLS) continue;
          for (const dr of [-1, 0, 1]) {
            const nr = r + dr;
            if (canStandAt(nr, nc, isBig) && !visited.has(key(nr, nc))) {
              if (dr === -1 && isSolidTile(this.grid[r - 1][c])) continue;
              visited.add(key(nr, nc));
              queue.push([nr, nc]);
            }
          }
        }

        for (const dir of [-1, 1]) {
          const runway = getFlatRunway(r, c, dir);
          const maxDx = (runway >= 3) ? 7 : 4;
          for (let dx = 1; dx <= maxDx; dx++) {
            const nc = c + dir * dx;
            if (nc < 0 || nc >= COLS) break;
            const maxUp = (dx <= 3) ? 5 : (dx <= 5 ? 4 : 3);
            for (let nr = Math.max(1, r - maxUp); nr <= Math.min(ROWS - 1, r + 6); nr++) {
              if (!visited.has(key(nr, nc)) && canStandAt(nr, nc, isBig)) {
                if (isLineOfSightClear(r, c, nr, nc, isBig)) {
                  visited.add(key(nr, nc));
                  queue.push([nr, nc]);
                }
              }
            }
          }
        }

        for (const pipe of this.pipes) {
          const inC = Math.floor(pipe.inX / TILE);
          const inR = Math.floor(pipe.inY / TILE);
          if (Math.abs(c - inC) <= 1 && r === inR) {
            const outC = Math.floor(pipe.outX / TILE);
            const outR = Math.floor(pipe.outY / TILE);
            if (canStandAt(outR, outC, isBig) && !visited.has(key(outR, outC))) {
              visited.add(key(outR, outC));
              queue.push([outR, outC]);
            }
          }
        }

        for (let vc = Math.max(0, c - 2); vc <= Math.min(COLS - 1, c + 2); vc++) {
          for (let vr = Math.max(1, r - 4); vr <= r; vr++) {
            if (this.grid[vr][vc] === T.Q_VINE || this.grid[vr][vc] === T.VINE) {
              let upperFloorR = -1;
              for (let sr = vr - 1; sr >= 1; sr--) {
                const st = this.grid[sr][vc];
                if (st === T.PIPE_TL || st === T.PIPE_TR || st === T.PIPE_BL || st === T.PIPE_BR) break;
                if (isTopSolidTile(st) && st !== T.VINE) {
                  upperFloorR = sr;
                  break;
                }
              }
              const topVineR = (upperFloorR !== -1) ? Math.max(1, upperFloorR - 3) : Math.max(1, vr - 10);
              for (let landR = topVineR; landR <= vr; landR++) {
                for (let landC = Math.max(0, vc - 2); landC <= Math.min(COLS - 1, vc + 2); landC++) {
                  if (canStandAt(landR, landC, isBig) && !visited.has(key(landR, landC))) {
                    visited.add(key(landR, landC));
                    queue.push([landR, landC]);
                  }
                }
              }
            }
          }
        }

        for (const lift of this.lifts) {
          const lc1 = Math.floor(lift.x / TILE);
          const lc2 = Math.floor((lift.x + lift.w - 1) / TILE);
          const liftBotR = Math.floor(lift.maxY / TILE);
          const liftTopR = Math.floor(lift.minY / TILE);
          if (c >= lc1 - 4 && c <= lc2 + 4 && Math.abs(r - liftBotR) <= 4) {
            for (let landC = Math.max(0, lc1 - 4); landC <= Math.min(COLS - 1, lc2 + 4); landC++) {
              for (let landR = Math.max(1, liftTopR - 4); landR <= Math.min(ROWS - 1, liftBotR + 2); landR++) {
                if (canStandAt(landR, landC, isBig) && !visited.has(key(landR, landC))) {
                  visited.add(key(landR, landC));
                  queue.push([landR, landC]);
                }
              }
            }
          }
        }
      }

      return { visited, goalReached };
    };

    for (let repairPass = 0; repairPass < 6; repairPass++) {
      const resSmall = computeReachable(false);
      const resBig = computeReachable(true);
      if (resSmall.goalReached && resBig.goalReached) {
        break;
      }

      let bestR = 22;
      let bestC = 2;
      for (const entry of resBig.visited) {
        const [rr, cc] = entry.split(',').map(Number);
        if (rr < bestR) {
          bestR = rr;
          bestC = cc;
        }
      }

      const goalCol = Math.floor(this.goal.x / TILE);
      const targetRow = Math.max(4, bestR - 4);
      let aimCol = goalCol;
      for (let r = targetRow; r >= Math.max(4, targetRow - 2); r--) {
        for (let c = 1; c < COLS - 1; c++) {
          if (canStandAt(r, c, true) && !resBig.visited.has(`${r},${c}`)) {
            aimCol = c;
            break;
          }
        }
      }

      const stepDir = (aimCol >= bestC) ? 1 : -1;
      const stepCenter = Math.max(2, Math.min(COLS - 3, bestC + stepDir * 3));
      for (let sc = stepCenter - 1; sc <= stepCenter + 1; sc++) {
        if (this.isPipeOrPipeSupport(targetRow, sc) || this.isPipeOrPipeSupport(targetRow - 1, sc)) continue;
        if (this.grid[targetRow][sc] === T.EMPTY) {
          this.grid[targetRow][sc] = T.ONEWAY;
        }
        for (let hr = targetRow - 2; hr < targetRow; hr++) {
          if (hr >= 1 && isSolidTile(this.grid[hr][sc]) && !this.isPipeOrPipeSupport(hr, sc)) {
            this.grid[hr][sc] = T.EMPTY;
          }
        }
      }

      this.ensureLiftsClearOfTerrain();
      this.enforceBigPlayerClearance();
    }

    const goalCol = Math.floor(this.goal.x / TILE);
    for (let c = Math.max(0, goalCol - 2); c <= Math.min(COLS - 1, goalCol + 2); c++) {
      this.grid[4][c] = T.HARD;
      for (let r = 1; r <= 3; r++) {
        if (isSolidTile(this.grid[r][c])) {
          this.grid[r][c] = T.EMPTY;
        }
      }
    }
  }

  createEnemy(type, x, y, minCol, maxCol) {
    return {
      type,
      x, y,
      w: 8, h: 8,
      vx: type === 'spiny' ? -0.45 : -0.35,
      vy: 0,
      minX: minCol * 8,
      maxX: maxCol * 8,
      shell: false,
      shellMoving: false,
      kickCooldown: 0,
      deadTimer: 0
    };
  }

  updatePlayerHitbox() {
    const prevBottom = this.player.y + this.player.h;
    this.player.w = 6;
    if (this.powerState === 0) {
      this.player.h = 8;
    } else {
      this.player.h = this.player.crouching ? 8 : 14;
    }
    this.player.y = prevBottom - this.player.h;
  }

  // ==========================================================================
  // INPUT HANDLING (PC KEYBOARD + MOBILE VIRTUAL STICK WITH ADAPTIVE NEUTRAL)
  // ==========================================================================
  bindInputs() {
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      psg.init();
      if (this.state === 'TITLE') {
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ') {
          this.startNewGame();
          return;
        }
      }
      if (this.state === 'GAMEOVER') {
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyZ') {
          this.returnToTitle();
          return;
        }
      }
      if (this.state === 'CREDITS' && this.creditsCanRetry) {
        this.returnToTitle();
        return;
      }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = true;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') this.input.up = true;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.input.down = true;
      if (e.code === 'KeyZ' || e.code === 'Space') {
        if (!this.input.a) this.input.aJustPressed = true;
        this.input.a = true;
      }
      if (e.code === 'KeyX') {
        if (!this.input.b) this.input.bJustPressed = true;
        this.input.b = true;
      }
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        this.input.dash = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = false;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') this.input.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.input.down = false;
      if (e.code === 'KeyZ' || e.code === 'Space') this.input.a = false;
      if (e.code === 'KeyX') this.input.b = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') this.input.dash = false;
    });

    this.canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      psg.init();
      if (this.state === 'TITLE') {
        this.startNewGame();
      } else if (this.state === 'GAMEOVER') {
        this.returnToTitle();
      } else if (this.state === 'CREDITS' && this.creditsCanRetry) {
        this.returnToTitle();
      }
    });

    document.getElementById('btn-mute').addEventListener('click', () => {
      const m = psg.toggleMute();
      document.getElementById('btn-mute').textContent = m ? 'SND:OFF' : 'SND:ON';
    });
    document.getElementById('btn-restart').addEventListener('click', () => {
      this.startNewGame();
    });
    document.getElementById('btn-stage').addEventListener('click', () => {
      psg.init();
      this.stage++;
      this.generateNewStageSeed();
      this.enterReadyScreen();
    });

    const stickZone = document.getElementById('stick-zone');
    const stickKnob = document.getElementById('stick-knob');
    let stickTouchId = null;
    let neutralOffsetX = 0;
    let neutralOffsetY = 0;

    const initDynamicNeutral = (clientX, clientY) => {
      const rect = stickZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxNeutralShift = rect.width * 0.36;
      neutralOffsetX = Math.max(-maxNeutralShift, Math.min(maxNeutralShift, clientX - cx));
      neutralOffsetY = Math.max(-maxNeutralShift, Math.min(maxNeutralShift, clientY - cy));
    };

    const updateStick = (clientX, clientY) => {
      const rect = stickZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const rawDx = clientX - cx;
      const rawDy = clientY - cy;

      if (neutralOffsetX > 0 && rawDx < neutralOffsetX) {
        neutralOffsetX = Math.max(0, rawDx);
      } else if (neutralOffsetX < 0 && rawDx > neutralOffsetX) {
        neutralOffsetX = Math.min(0, rawDx);
      }

      if (neutralOffsetY > 0 && rawDy < neutralOffsetY) {
        neutralOffsetY = Math.max(0, rawDy);
      } else if (neutralOffsetY < 0 && rawDy > neutralOffsetY) {
        neutralOffsetY = Math.min(0, rawDy);
      }

      const dx = rawDx - neutralOffsetX;
      const dy = rawDy - neutralOffsetY;
      const dist = Math.hypot(dx, dy);
      const zoneRadius = rect.width * 0.5;
      const maxR = rect.width * 0.42;
      const dashThreshold = zoneRadius * 0.85;
      const rawDist = Math.hypot(rawDx, rawDy);

      let knobDx = dx;
      let knobDy = dy;
      if (dist > maxR) {
        knobDx = (dx / dist) * maxR;
        knobDy = (dy / dist) * maxR;
      }
      stickKnob.style.transform = `translate(${knobDx}px, ${knobDy}px)`;

      this.input.left = false;
      this.input.right = false;
      this.input.up = false;
      this.input.down = false;
      this.input.dash = false;

      if (dist >= 6) {
        const angle = Math.atan2(dy, dx) * (180 / Math.PI);
        const isDeepDash = (dist >= dashThreshold || rawDist >= zoneRadius * 0.90);
        const isDashingOrFast = (this.input.dash || Math.abs(this.player.vx) > 0.9 || this.player.crouching);
        const downMinAngle = isDashingOrFast ? 38 : 72;
        const downMaxAngle = isDashingOrFast ? 142 : 108;

        if (angle >= downMinAngle && angle <= downMaxAngle) {
          this.input.down = true;
          if (angle < 72) {
            this.input.right = true;
            if (isDeepDash) this.input.dash = true;
          } else if (angle > 108) {
            this.input.left = true;
            if (isDeepDash) this.input.dash = true;
          }
        } else if (angle <= -65 && angle >= -115) {
          this.input.up = true;
        } else if (angle > -65 && angle < downMinAngle) {
          this.input.right = true;
          if (isDeepDash) this.input.dash = true;
        } else {
          this.input.left = true;
          if (isDeepDash) this.input.dash = true;
        }
      }
      stickZone.classList.toggle('dashing', this.input.dash);
    };

    const resetStick = () => {
      stickTouchId = null;
      neutralOffsetX = 0;
      neutralOffsetY = 0;
      stickKnob.style.transform = 'translate(0px, 0px)';
      stickZone.classList.remove('dashing');
      this.input.left = false;
      this.input.right = false;
      this.input.up = false;
      this.input.down = false;
      this.input.dash = false;
    };

    stickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      psg.init();
      if (this.state === 'TITLE') {
        this.startNewGame();
        return;
      }
      if (this.state === 'GAMEOVER') {
        this.returnToTitle();
        return;
      }
      if (this.state === 'CREDITS' && this.creditsCanRetry) {
        this.returnToTitle();
        return;
      }
      if (stickTouchId === null && e.changedTouches.length > 0) {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        initDynamicNeutral(t.clientX, t.clientY);
        updateStick(t.clientX, t.clientY);
      }
    }, { passive: false });

    stickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (t.identifier === stickTouchId) {
          updateStick(t.clientX, t.clientY);
        }
      }
    }, { passive: false });

    stickZone.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === stickTouchId) {
          resetStick();
        }
      }
    }, { passive: false });
    stickZone.addEventListener('touchcancel', resetStick);

    const actionZone = document.getElementById('action-zone');
    const btnFire = document.getElementById('btn-fire');
    const btnA = document.getElementById('btn-a');

    const evaluateActionTouches = (touches) => {
      const rectFire = btnFire.getBoundingClientRect();
      const rectA = btnA.getBoundingClientRect();
      let hitFire = false;
      let hitA = false;

      for (let i = 0; i < touches.length; i++) {
        const t = touches[i];
        const dFire = Math.hypot(t.clientX - (rectFire.left + rectFire.width / 2), t.clientY - (rectFire.top + rectFire.height / 2));
        const dA = Math.hypot(t.clientX - (rectA.left + rectA.width / 2), t.clientY - (rectA.top + rectA.height / 2));

        if (dFire <= rectFire.width * 0.72) {
          hitFire = true;
        }
        if (dA <= rectA.width * 0.72) {
          hitA = true;
        }
      }

      if (hitFire && !this.input.b) this.input.bJustPressed = true;
      if (hitA && !this.input.a) this.input.aJustPressed = true;

      this.input.b = hitFire;
      this.input.a = hitA;

      btnFire.classList.toggle('active', hitFire);
      btnA.classList.toggle('active', hitA);
    };

    actionZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      psg.init();
      if (this.state === 'TITLE') {
        this.startNewGame();
        return;
      }
      if (this.state === 'GAMEOVER') {
        this.returnToTitle();
        return;
      }
      if (this.state === 'CREDITS' && this.creditsCanRetry) {
        this.returnToTitle();
        return;
      }
      evaluateActionTouches(e.targetTouches);
    }, { passive: false });

    actionZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      evaluateActionTouches(e.targetTouches);
    }, { passive: false });

    actionZone.addEventListener('touchend', (e) => {
      e.preventDefault();
      evaluateActionTouches(e.targetTouches);
    }, { passive: false });

    actionZone.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      this.input.a = false;
      this.input.b = false;
      btnA.classList.remove('active');
      btnFire.classList.remove('active');
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
  }

  // ==========================================================================
  // MAIN UPDATE LOOP
  // ==========================================================================
  update() {
    this.frame++;

    if (this.state === 'READY') {
      this.stateTimer--;
      if (this.stateTimer <= 0) this.beginStage();
      this.clearJustPressed();
      return;
    }

    if (this.state === 'DYING') {
      this.stateTimer--;
      this.player.vy += 0.14;
      this.player.y += this.player.vy;
      if (this.stateTimer <= 0) {
        this.lives--;
        if (this.lives <= 0) {
          if (this.stage > 32) {
            this.updateHighRecords();
            this.creditsUnlocked = true;
            this.creditsScrollY = 192;
            this.creditsFinalCard = false;
            this.creditsFinalTimer = 0;
            this.creditsCanRetry = false;
            this.state = 'CREDITS';
            psg.stopBGM();
          } else {
            this.updateHighRecords();
            this.state = 'GAMEOVER';
          }
        } else {
          this.powerState = 0;
          this.enterReadyScreen();
        }
      }
      this.clearJustPressed();
      return;
    }

    if (this.state === 'STAGE_CLEAR') {
      this.stateTimer--;
      const p = this.player;
      const poleBottomY = this.goal.baseY - 3;
      const targetPlayerX = this.goal.x - p.w;
      p.x += (targetPlayerX - p.x) * 0.35;
      p.dir = 1;
      p.crouching = false;
      this.updatePlayerHitbox();
      p.vx = 0;
      p.vy = 0;

      if (this.goal.flagY < this.goal.baseY - 8) {
        this.goal.flagY = Math.min(this.goal.baseY - 8, this.goal.flagY + 0.85);
      }
      if (p.y + p.h < poleBottomY) {
        p.y = Math.min(poleBottomY - p.h, p.y + 0.85);
        p.animFrame += 0.12;
      } else {
        p.y = poleBottomY - p.h;
        p.animFrame = 0;
      }
      if (this.stateTimer <= 0) {
        this.stage++;
        this.updateHighRecords();
        this.generateNewStageSeed();
        this.enterReadyScreen();
      }
      this.clearJustPressed();
      return;
    }

    if (this.state === 'CREDITS') {
      this.updateHighRecords();
      if (!this.creditsFinalCard) {
        this.creditsScrollY -= 0.45;
        if (this.creditsScrollY < -255) {
          this.creditsFinalCard = true;
          this.creditsCanRetry = true;
          this.creditsFinalTimer = 0;
        }
      } else {
        this.creditsFinalTimer = (this.creditsFinalTimer || 0) + 1;
      }
      if (this.creditsCanRetry && (this.input.aJustPressed || this.input.bJustPressed || this.input.up || this.input.down || this.input.left || this.input.right || this.input.dash)) {
        this.returnToTitle();
      }
      this.clearJustPressed();
      return;
    }

    if (this.state !== 'PLAYING') {
      this.clearJustPressed();
      return;
    }

    for (let i = this.bouncingBlocks.length - 1; i >= 0; i--) {
      const bb = this.bouncingBlocks[i];
      bb.timer++;
      if (bb.timer >= bb.maxTimer) {
        this.bouncingBlocks.splice(i, 1);
      }
    }

    for (let i = this.vinesGrowing.length - 1; i >= 0; i--) {
      const vg = this.vinesGrowing[i];
      vg.timer++;
      if (vg.timer % 4 === 0) {
        if (vg.currRow >= vg.targetRow && vg.currRow >= 1) {
          const curTile = this.grid[vg.currRow][vg.col];
          if (curTile !== T.PIPE_TL && curTile !== T.PIPE_TR && curTile !== T.PIPE_BL && curTile !== T.PIPE_BR) {
            this.grid[vg.currRow][vg.col] = T.VINE;
            vg.currRow--;
          } else {
            this.vinesGrowing.splice(i, 1);
          }
        } else {
          this.vinesGrowing.splice(i, 1);
        }
      }
    }

    this.lifts.forEach((lift) => {
      lift.prevY = lift.y;
      lift.y += lift.vy;
      if (lift.y <= lift.minY) {
        lift.y = lift.minY;
        lift.vy = Math.abs(lift.vy);
      } else if (lift.y >= lift.maxY) {
        lift.y = lift.maxY;
        lift.vy = -Math.abs(lift.vy);
      }
    });

    if (this.checkLiftCrush()) {
      this.clearJustPressed();
      return;
    }

    this.updatePlayer();
    this.updateItems();
    this.updateFireballs();
    this.updateEnemies();
    this.updateBoss();
    this.updateParticlesAndPopups();

    this.clearJustPressed();
  }

  clearJustPressed() {
    this.input.aJustPressed = false;
    this.input.bJustPressed = false;
  }

  triggerBlockBounce(r, c) {
    this.bouncingBlocks = this.bouncingBlocks.filter((b) => !(b.r === r && b.c === c));
    this.bouncingBlocks.push({ r, c, timer: 0, maxTimer: 12 });

    for (const en of this.enemies) {
      if (en.deadTimer === 0 && Math.abs((en.y + en.h) - r * TILE) <= 3 && Math.abs((en.x + 4) - (c * TILE + 4)) <= 8) {
        en.deadTimer = 20;
        en.vy = -1.6;
        this.addScore(100, en.x, en.y);
        psg.sfxStomp();
      }
    }
    for (const it of this.items) {
      if (Math.abs((it.y + it.h) - r * TILE) <= 4 && Math.abs((it.x + 4) - (c * TILE + 4)) <= 8) {
        it.vy = -1.6;
      }
    }
  }

  // ==========================================================================
  // LIFT CRUSH + PLAYER PHYSICS (WITH COYOTE TIME)
  // ==========================================================================
  checkLiftCrush() {
    if (this.state !== 'PLAYING') return false;
    const p = this.player;
    if (p.invuln > 0) return false;
    const c1 = Math.floor((p.x + 0.6) / TILE);
    const c2 = Math.floor((p.x + p.w - 0.6) / TILE);

    for (const lift of this.lifts) {
      const liftMovingUp = (lift.vy < 0);
      // リフトの上面に立っている（乗っている）判定のみを圧死対象にする
      // 地面にいる時に上からリフトが降りてきた場合はそのまま通過させる
      const onLiftTop = (
        p.x + p.w > lift.x &&
        p.x < lift.x + lift.w &&
        Math.abs((p.y + p.h) - lift.y) <= 1.5
      );

      if (liftMovingUp && onLiftTop) {
        const rHead = Math.floor((p.y - 0.5) / TILE);
        if (rHead >= 0 && rHead < ROWS) {
          for (let c = c1; c <= c2; c++) {
            if (c >= 0 && c < COLS && isSolidTile(this.grid[rHead][c])) {
              this.killPlayer();
              return true;
            }
          }
        }
      }
    }
    return false;
  }

  awardStompCombo(en, x, y) {
    const table = [100, 200, 400, 500, 800, 1000, 2000, 4000, 8000];
    const idx = this.stompCombo;
    this.stompCombo++;

    if (idx < table.length) {
      const pts = table[idx];
      this.addScore(pts, x, y);
      psg.sfxStomp();
    } else if (this.combo1UpCount < 3) {
      this.lives++;
      this.combo1UpCount++;
      this.popups.push({ text: '1UP', x, y: y - 6, timer: 45, color: MSX.LIGHT_GREEN });
      psg.sfxPowerup();

      if (this.combo1UpCount >= 3) {
        this.combo1UpCount = 0;
        this.stompCombo = 0;
        if (en && en.deadTimer === 0) {
          en.shell = false;
          en.shellMoving = false;
          en.deadTimer = 18;
          en.vy = -1.5;
        }
        this.popups.push({ text: '1UP KO!', x, y: y - 14, timer: 48, color: MSX.LIGHT_YELLOW });
      }
    } else {
      this.combo1UpCount = 0;
      this.stompCombo = 0;
      if (en && en.deadTimer === 0) {
        en.shell = false;
        en.shellMoving = false;
        en.deadTimer = 18;
        en.vy = -1.5;
      }
      this.popups.push({ text: 'KO!', x, y: y - 6, timer: 42, color: MSX.MED_RED });
      psg.sfxBreak();
    }
  }

  updatePlayer() {
    const p = this.player;
    if (p.invuln > 0) p.invuln--;
    if (p.shrinkAnim > 0) p.shrinkAnim--;
    if (p.fireCooldown > 0) p.fireCooldown--;
    if (p.pipeCooldown > 0) p.pipeCooldown--;

    const centerCol = Math.floor((p.x + p.w / 2) / TILE);
    const topRow = Math.floor((p.y + 1) / TILE);
    const botRow = Math.floor((p.y + p.h - 1) / TILE);
    let onVineTile = false;
    if (centerCol >= 0 && centerCol < COLS) {
      for (let r = Math.max(0, topRow); r <= Math.min(ROWS - 1, botRow); r++) {
        if (this.grid[r][centerCol] === T.VINE) {
          onVineTile = true;
          break;
        }
      }
    }

    if (onVineTile && (this.input.up || (this.input.down && !p.onGround))) {
      p.onVine = true;
      this.stompCombo = 0;
      p.coyoteTimer = 0;
      p.vx = 0;
      p.vy = 0;
    }
    if (!onVineTile) {
      p.onVine = false;
    }

    if (p.onVine) {
      const vineCenterX = centerCol * TILE + 4 - p.w / 2;
      if (!this.input.left && !this.input.right) {
        p.x += (vineCenterX - p.x) * 0.25;
      }
      if (this.input.up) {
        const upperCheckRow = Math.floor((p.y + p.h - 4) / TILE);
        if (upperCheckRow >= 0 && upperCheckRow < ROWS && this.grid[upperCheckRow][centerCol] === T.VINE) {
          const prevVineY = p.y;
          p.y -= 0.78;
          const headR = Math.floor(p.y / TILE);
          const c1 = Math.floor((p.x + 0.6) / TILE);
          const c2 = Math.floor((p.x + p.w - 0.6) / TILE);
          if (headR >= 0 && headR < ROWS) {
            for (let c = c1; c <= c2; c++) {
              if (c >= 0 && c < COLS && isSolidTile(this.grid[headR][c])) {
                p.y = Math.max(prevVineY, (headR + 1) * TILE);
                break;
              }
            }
          }
        }
      }
      if (this.input.down) {
        const prevVineBottom = p.y + p.h;
        p.y += 0.78;
        const footR = Math.floor((p.y + p.h) / TILE);
        const c1 = Math.floor((p.x + 0.6) / TILE);
        const c2 = Math.floor((p.x + p.w - 0.6) / TILE);
        if (footR >= 0 && footR < ROWS) {
          for (let c = c1; c <= c2; c++) {
            if (c >= 0 && c < COLS) {
              const ft = this.grid[footR][c];
              if (isSolidTile(ft) || (isTopSolidTile(ft) && prevVineBottom <= footR * TILE + 2)) {
                p.y = footR * TILE - p.h;
                p.onGround = true;
                p.onVine = false;
                break;
              }
            }
          }
        }
      }
      if (this.input.left) {
        p.vx = -0.65;
        p.x += p.vx;
        p.dir = -1;
        this.resolveHorizontalTiles(p);
        p.vx = 0;
      }
      if (this.input.right) {
        p.vx = 0.65;
        p.x += p.vx;
        p.dir = 1;
        this.resolveHorizontalTiles(p);
        p.vx = 0;
      }
      if (this.input.aJustPressed) {
        p.onVine = false;
        p.coyoteTimer = 0;
        p.vy = -2.55;
        psg.sfxJump(this.powerState > 0);
      }
      p.x = Math.max(1, Math.min(256 - p.w - 1, p.x));
      p.y = Math.max(0, p.y);
      this.checkGoalAndCoins();
      return;
    }

    if (p.onGround && this.input.down && Math.abs(p.vx) < 0.45 && p.pipeCooldown <= 0) {
      const pxMid = p.x + p.w / 2;
      const pBottom = p.y + p.h;
      const onPipeTop = (targetX, targetY) => {
        const pipeLeft = targetX - 4;
        const pipeRight = targetX + 12;
        return pxMid >= pipeLeft - 1 && pxMid <= pipeRight + 1 && Math.abs(pBottom - targetY) <= 3;
      };
      for (const pipe of this.pipes) {
        if (onPipeTop(pipe.inX, pipe.inY)) {
          psg.sfxPipe();
          p.x = pipe.outX - p.w / 2;
          p.y = pipe.outY - p.h;
          p.vx = 0;
          p.vy = 0;
          p.pipeCooldown = 24;
          this.spawnSparkle(pipe.outX, pipe.outY - 6);
          return;
        }
        if (onPipeTop(pipe.outX, pipe.outY)) {
          psg.sfxPipe();
          p.x = pipe.inX - p.w / 2;
          p.y = pipe.inY - p.h;
          p.vx = 0;
          p.vy = 0;
          p.pipeCooldown = 24;
          this.spawnSparkle(pipe.inX, pipe.inY - 6);
          return;
        }
      }
    }

    const mustStayCrouched = (this.powerState > 0 && p.crouching && !this.canStandUp());
    if (this.powerState > 0) {
      const wantCrouch = p.onGround
        ? (this.input.down || mustStayCrouched)
        : (p.crouching || mustStayCrouched);
      if (wantCrouch !== p.crouching) {
        p.crouching = wantCrouch;
        this.updatePlayerHitbox();
      }
    } else {
      p.crouching = false;
    }

    if (this.powerState === 2 && this.input.bJustPressed && p.fireCooldown <= 0 && this.fireballs.length < 2) {
      this.fireballs.push({
        x: p.dir === 1 ? p.x + p.w : p.x - 4,
        y: p.y + (p.crouching ? 2 : 4),
        vx: p.dir * 2.1,
        vy: 0.8
      });
      p.fireCooldown = 14;
      psg.sfxFire();
    }

    const maxSpeed = this.input.dash ? 1.35 : 0.85;
    const accel = p.onGround ? 0.085 : 0.065;

    if (p.onGround && p.crouching && !mustStayCrouched) {
      p.vx *= 0.92;
      if (Math.abs(p.vx) < 0.04) p.vx = 0;
    } else if (p.onGround && mustStayCrouched) {
      const crouchWalkMax = 0.65;
      if (this.input.left) {
        p.vx = Math.max(-crouchWalkMax, p.vx - accel);
        p.dir = -1;
      } else if (this.input.right) {
        p.vx = Math.min(crouchWalkMax, p.vx + accel);
        p.dir = 1;
      } else {
        p.vx *= 0.82;
      }
    } else {
      if (this.input.left) {
        p.vx = Math.max(-maxSpeed, p.vx - accel);
        p.dir = -1;
      } else if (this.input.right) {
        p.vx = Math.min(maxSpeed, p.vx + accel);
        p.dir = 1;
      } else {
        const friction = p.onGround ? 0.82 : 0.96;
        p.vx *= friction;
        if (Math.abs(p.vx) < 0.03) p.vx = 0;
      }
    }

    p.x += p.vx;
    if (p.x < 1) { p.x = 1; p.vx = 0; }
    if (p.x + p.w > 255) { p.x = 255 - p.w; p.vx = 0; }
    this.resolveHorizontalTiles(p);

    if (this.input.aJustPressed && (p.onGround || p.coyoteTimer > 0)) {
      if (p.crouching) {
        if (this.input.left && p.vx > -maxSpeed * 0.85) p.vx = -maxSpeed * 0.85;
        if (this.input.right && p.vx < maxSpeed * 0.85) p.vx = maxSpeed * 0.85;
      }
      const isDashing = (this.input.dash && Math.abs(p.vx) > 0.95);
      p.vy = isDashing ? -3.15 : -2.75;
      p.onGround = false;
      p.coyoteTimer = 0;
      p.jumpHeld = true;
      psg.sfxJump(this.powerState > 0);
    }

    if (!this.input.a || p.vy >= 0) {
      p.jumpHeld = false;
    }
    const grav = (p.jumpHeld && p.vy < 0) ? 0.088 : 0.165;
    p.vy = Math.min(3.2, p.vy + grav);

    const wasOnGround = p.onGround;
    const prevY = p.y;
    p.y += p.vy;
    p.onGround = false;
    this.resolveVerticalTiles(p, prevY);

    if (p.vy >= 0) {
      for (const lift of this.lifts) {
        const prevBottom = prevY + p.h;
        const currBottom = p.y + p.h;
        if (
          p.x + p.w > lift.x &&
          p.x < lift.x + lift.w &&
          prevBottom <= lift.prevY + 2 &&
          currBottom >= lift.y
        ) {
          p.y = lift.y - p.h;
          p.vy = 0;
          p.onGround = true;
          this.stompCombo = 0;
        }
      }
    }

    if (this.checkLiftCrush()) {
      return;
    }

    if (p.onGround) {
      p.coyoteTimer = 6;
    } else if (wasOnGround && p.vy >= 0) {
      p.coyoteTimer = 5;
    } else if (p.coyoteTimer > 0) {
      p.coyoteTimer--;
    }

    if (p.onGround && Math.abs(p.vx) > 0.08) {
      p.animFrame += Math.abs(p.vx) * 0.25;
    } else if (p.onGround) {
      p.animFrame = 0;
    }

    const footRow = Math.floor((p.y + p.h - 1) / TILE);
    const footCol = Math.floor((p.x + p.w / 2) / TILE);
    if (footRow >= 0 && footRow < ROWS && footCol >= 0 && footCol < COLS) {
      if (this.grid[footRow][footCol] === T.LAVA) {
        this.killPlayer();
        return;
      }
    }
    if (p.y > 192) {
      this.killPlayer();
      return;
    }

    this.checkGoalAndCoins();
  }

  canStandUp() {
    const p = this.player;
    const testTop = (p.y + p.h) - 14;
    if (testTop < 0) return true;
    const c1 = Math.floor((p.x + 0.5) / TILE);
    const c2 = Math.floor((p.x + p.w - 0.5) / TILE);
    const rTop = Math.floor(testTop / TILE);
    for (let c = c1; c <= c2; c++) {
      if (c >= 0 && c < COLS && rTop >= 0 && rTop < ROWS) {
        if (isSolidTile(this.grid[rTop][c])) return false;
      }
    }
    return true;
  }

  resolveHorizontalTiles(ent) {
    const headTrim = (ent === this.player) ? 2 : 1;
    const r1 = Math.floor((ent.y + headTrim) / TILE);
    const r2 = Math.floor((ent.y + ent.h - 1) / TILE);
    if (ent.vx > 0) {
      const c = Math.floor((ent.x + ent.w) / TILE);
      if (c >= 0 && c < COLS) {
        for (let r = r1; r <= r2; r++) {
          if (r >= 0 && r < ROWS && isSolidTile(this.grid[r][c])) {
            ent.x = c * TILE - ent.w;
            ent.vx = 0;
            break;
          }
        }
      }
    } else if (ent.vx < 0) {
      const c = Math.floor(ent.x / TILE);
      if (c >= 0 && c < COLS) {
        for (let r = r1; r <= r2; r++) {
          if (r >= 0 && r < ROWS && isSolidTile(this.grid[r][c])) {
            ent.x = (c + 1) * TILE;
            ent.vx = 0;
            break;
          }
        }
      }
    }
  }

  resolveVerticalTiles(p, prevY) {
    const c1 = Math.floor((p.x + 0.6) / TILE);
    const c2 = Math.floor((p.x + p.w - 0.6) / TILE);

    if (p.vy < 0) {
      const headY = p.y + 2;
      if (headY < 0) return;
      const r = Math.floor(headY / TILE);
      if (r >= 0 && r < ROWS) {
        let hitCol = -1;
        let minDist = 999;
        const pCenter = p.x + p.w / 2;

        for (let c = c1; c <= c2; c++) {
          if (c >= 0 && c < COLS && isSolidTile(this.grid[r][c])) {
            const tileCenter = c * TILE + 4;
            const d = Math.abs(pCenter - tileCenter);
            if (d < minDist) {
              minDist = d;
              hitCol = c;
            }
          }
        }

        if (hitCol !== -1) {
          p.y = (r + 1) * TILE - 2;
          p.vy = 0.2;
          p.jumpHeld = false;
          this.hitBlockFromBelow(r, hitCol);
        }
      }
    } else if (p.vy >= 0) {
      const r = Math.floor((p.y + p.h) / TILE);
      const prevBottom = prevY + p.h;
      if (r >= 0 && r < ROWS) {
        for (let c = c1; c <= c2; c++) {
          if (c >= 0 && c < COLS) {
            const t = this.grid[r][c];
            if (isSolidTile(t)) {
              p.y = r * TILE - p.h;
              p.vy = 0;
              p.onGround = true;
              this.stompCombo = 0;
              break;
            } else if (isTopSolidTile(t) && prevBottom <= r * TILE + 2) {
              p.y = r * TILE - p.h;
              p.vy = 0;
              p.onGround = true;
              this.stompCombo = 0;
              break;
            }
          }
        }
      }
    }
  }

  hitBlockFromBelow(r, c) {
    const t = this.grid[r][c];

    if (t === T.Q_COIN) {
      this.grid[r][c] = T.USED;
      this.triggerBlockBounce(r, c);
      this.collectCoin(c * TILE + 4, r * TILE - 4);
      this.spawnSparkle(c * TILE + 4, r * TILE - 4);
    } else if (t === T.Q_POWER) {
      this.grid[r][c] = T.USED;
      this.triggerBlockBounce(r, c);
      psg.sfxPowerupAppear();
      const itemType = (this.powerState >= 1) ? 'flower' : 'mushroom';
      this.spawnItemHop(itemType, c * TILE, (r - 1) * TILE);
    } else if (t === T.Q_VINE) {
      this.grid[r][c] = T.USED;
      this.triggerBlockBounce(r, c);
      psg.sfxVine();
      let highestFloorRow = -1;
      for (let scanR = r - 1; scanR >= 3; scanR--) {
        const st = this.grid[scanR][c];
        if (st === T.PIPE_TL || st === T.PIPE_TR || st === T.PIPE_BL || st === T.PIPE_BR) {
          break;
        }
        if (isTopSolidTile(st) && st !== T.VINE) {
          highestFloorRow = scanR;
        }
      }
      const computedTargetRow = (highestFloorRow !== -1)
        ? Math.max(1, highestFloorRow - 3)
        : 2;
      this.vinesGrowing.push({
        col: c,
        currRow: r - 1,
        targetRow: computedTargetRow,
        timer: 0
      });
