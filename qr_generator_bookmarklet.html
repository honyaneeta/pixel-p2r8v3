<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード生成ツール</title>
  <!-- QRコード生成用ライブラリ (qrcodejs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 20px;
      color: #1a202c;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3182ce;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #3182ce;
      color: #ffffff;
      flex: 1;
    }
    .btn-primary:hover {
      background-color: #2b6cb0;
    }
    .btn-secondary {
      background-color: #48bb78;
      color: #ffffff;
      display: none;
    }
    .btn-secondary:hover {
      background-color: #38a169;
    }
    #qrcode-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      background-color: #f8fafc;
      border: 1px dashed #cbd5e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    #qrcode img, #qrcode canvas {
      margin: 0 auto;
      display: block;
    }
    .note {
      font-size: 0.8rem;
      color: #718096;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>URL → QRコード生成ツール</h1>
  <div class="input-group">
    <input type="text" id="url-input" value="https://honyaneeta.github.io/pixel-p2r8v3/MSX%20Godrays.html" placeholder="URLを入力してください">
    <div class="btn-group">
      <button class="btn-primary" onclick="generateQR()">QRコードを作成</button>
      <button id="download-btn" class="btn-secondary" onclick="downloadQR()">PNG保存</button>
    </div>
  </div>

  <div id="qrcode-wrapper">
    <div id="qrcode"></div>
  </div>
  <p class="note">スマホのカメラで読み取り可能な正確なQRコードを生成します。</p>
</div>

<script>
  const qrContainer = document.getElementById("qrcode");
  const urlInput = document.getElementById("url-input");
  const downloadBtn = document.getElementById("download-btn");
  const fallbackUrl = urlInput.value;

  function getInitialUrl() {
    // 1. クエリパラメータ (?url=...) があれば最優先で採用
    const params = new URLSearchParams(window.location.search);
    const paramUrl = params.get("url");
    if (paramUrl && paramUrl.trim()) {
      return paramUrl.trim();
    }

    // 2. 直前の遷移元 (document.referrer) があれば採用（自分自身は除外）
    if (document.referrer && document.referrer !== window.location.href) {
      return document.referrer;
    }

    // 3. どちらも無ければデフォルトURL
    return fallbackUrl;
  }

  function generateQR() {
    const url = urlInput.value.trim();
    if (!url) {
      alert("URLを入力してください。");
      return;
    }

    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
      text: url,
      width: 220,
      height: 220,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    setTimeout(() => {
      downloadBtn.style.display = "inline-block";
    }, 100);
  }

  function downloadQR() {
    const img = qrContainer.querySelector("img");
    const canvas = qrContainer.querySelector("canvas");
    let dataUrl = "";

    if (img && img.src) {
      dataUrl = img.src;
    } else if (canvas) {
      dataUrl = canvas.toDataURL("image/png");
    }

    if (dataUrl) {
      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "qrcode.png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  }

  window.addEventListener("DOMContentLoaded", () => {
    urlInput.value = getInitialUrl();
    generateQR();
  });
</script>

</body>
</html>
