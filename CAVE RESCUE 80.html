<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CAVE RESCUE 80 - TIC-80 Style Action</title>
  <style>
    /* Reset & Mobile-First 100dvh Viewport Lock + Anti-Haptic Long-Press Rules */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html, body, canvas, button, .controls-deck, .dpad, .pad-btn, .act-btn, .bezel {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #11121d;
      color: #f4f4f4;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Top Header / Audio Toggle */
    .top-bar {
      width: 100%;
      max-width: 760px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94b0c2;
      flex-shrink: 0;
    }

    .title-badge {
      font-weight: bold;
      letter-spacing: 1px;
      color: #ffcd75;
    }

    .audio-btn {
      background: #29366f;
      border: 2px solid #41a6f6;
      color: #f4f4f4;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .audio-btn:active {
      background: #3b5dc9;
    }

    /* Main Screen Container (Guaranteed non-zero 240x136 16:9 Aspect Ratio) */
    .screen-wrapper {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      min-height: 140px;
    }

    .bezel {
      position: relative;
      aspect-ratio: 240 / 136;
      width: min(100%, 720px);
      height: auto;
      max-height: 100%;
      background: #1a1c2c;
      border: 4px solid #333c57;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75), inset 0 0 0 2px #566c86;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Mobile Touch Controls Deck */
    .controls-deck {
      width: 100%;
      max-width: 760px;
      height: 158px;
      padding: 8px 14px 14px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1c2c;
      border-top: 2px solid #333c57;
      flex-shrink: 0;
    }

    @media (min-width: 768px) and (pointer: fine) {
      .controls-deck {
        height: 48px;
        padding: 6px 16px;
        justify-content: center;
      }
      .touch-pad-group {
        display: none !important;
      }
      .desktop-hint {
        display: block !important;
      }
    }

    .desktop-hint {
      display: none;
      font-size: 12px;
      color: #94b0c2;
      text-align: center;
    }

    .touch-pad-group {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Directional D-Pad Grid */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 42px);
      gap: 4px;
    }

    .pad-btn {
      background: #333c57;
      border: 2px solid #566c86;
      border-radius: 8px;
      color: #f4f4f4;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #11121d;
    }

    .pad-btn.active {
      background: #41a6f6;
      border-color: #73eff7;
      color: #1a1c2c;
      transform: translateY(2px);
      box-shadow: 0 1px 0 #11121d;
    }

    /* Action Buttons (Laser & Dynamite) */
    .action-cluster {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .act-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #11121d;
      line-height: 1.1;
    }

    .btn-bomb {
      background: #b13e53;
      border: 3px solid #ef7d57;
      color: #ffcd75;
      margin-top: 24px;
    }

    .btn-bomb.active {
      background: #ef7d57;
      color: #1a1c2c;
      transform: translateY(3px);
      box-shadow: 0 1px 0 #11121d;
    }

    .btn-laser {
      background: #257179;
      border: 3px solid #73eff7;
      color: #f4f4f4;
      margin-bottom: 16px;
    }

    .btn-laser.active {
      background: #73eff7;
      color: #1a1c2c;
      transform: translateY(3px);
      box-shadow: 0 1px 0 #11121d;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <span class="title-badge">CAVE RESCUE 80 // 240x136</span>
    <button id="audioToggle" class="audio-btn">SOUND: ON</button>
  </div>

  <!-- Main TIC-80 Canvas Container -->
  <div class="screen-wrapper" id="screenWrapper">
    <div class="bezel" id="bezel">
      <canvas id="gameCanvas" width="240" height="136"></canvas>
    </div>
  </div>

  <!-- Responsive Controls Deck -->
  <div class="controls-deck" id="controlsDeck">
    <div class="desktop-hint">
      [ARROWS / WASD] Move &amp; Hover &nbsp;|&nbsp; [Z / SPACE] Laser &nbsp;|&nbsp; [X / DOWN+Z] Dynamite
    </div>

    <div class="touch-pad-group" id="touchPadGroup">
      <!-- D-Pad -->
      <div class="dpad" id="dpad">
        <div></div>
        <div class="pad-btn" data-key="up">▲</div>
        <div></div>
        <div class="pad-btn" data-key="left">◀</div>
        <div class="pad-btn" data-key="down">▼</div>
        <div class="pad-btn" data-key="right">▶</div>
        <div></div>
        <div></div>
        <div></div>
      </div>

      <!-- Action Buttons -->
      <div class="action-cluster">
        <div class="act-btn btn-bomb" data-key="bomb">
          <span>BOMB</span>
          <span style="font-size:9px;opacity:0.85;">DYNAMITE</span>
        </div>
        <div class="act-btn btn-laser" data-key="laser">
          <span>FIRE</span>
          <span style="font-size:9px;opacity:0.85;">LASER</span>
        </div>
      </div>
    </div>
  </div>

<script>
/**
 * CAVE RESCUE 80
 * TIC-80 Hardware Spec Tribute (240x136, Sweetie-16 Palette, 8x8 Tile Grid, Web Audio Chiptune SFX)
 * Features:
 *  - Anti-haptic mobile touch controls (prevents Android Chrome long-press vibration/context menu)
 *  - Dedicated offscreen destination-out light mask for symmetrical left & right headlamp beams
 *  - Clear-guaranteed procedural cave stages with airtight destructible barriers
 */
(() => {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS & TIC-80 SWEETIE-16 PALETTE
  // =========================================================================
  const PAL = [
    '#1a1c2c', // 0: Void Black
    '#5d275d', // 1: Deep Purple
    '#b13e53', // 2: Crimson Red
    '#ef7d57', // 3: Magma Orange
    '#ffcd75', // 4: Bright Yellow
    '#a7f070', // 5: Lime Green
    '#38b764', // 6: Emerald Green
    '#257179', // 7: Deep Teal
    '#29366f', // 8: Navy Blue
    '#3b5dc9', // 9: Royal Blue
    '#41a6f6', // 10: Sky Blue
    '#73eff7', // 11: Cyan / Laser
    '#f4f4f4', // 12: Pure White
    '#94b0c2', // 13: Light Slate
    '#566c86', // 14: Mid Slate
    '#333c57'  // 15: Dark Slate
  ];

  const SCREEN_W = 240;
  const SCREEN_H = 136;
  const HUD_H = 16;          // Top 16px (2 rows of 8px) reserved for HUD
  const PLAY_Y0 = 16;        // Playfield starts at y = 16
  const PLAY_H = 120;        // Bottom 120px (15 rows of 8px) is playfield
  const TILE_SIZE = 8;
  const COLS = 30;           // 240 / 8 = 30
  const ROWS = 15;           // 120 / 8 = 15

  // Tile Types
  const T_EMPTY   = 0;
  const T_ROCK    = 1; // Indestructible cave rock
  const T_DIRT    = 2; // Airtight destructible barrier (1 Dynamite or 4 Laser shots)
  const T_MAGMA   = 3; // Lethal glowing magma rock
  const T_SUPPORT = 4; // Thin platform

  // Room Transition Safety Constants (prevents ping-pong bounce-back)
  const ENTRY_MARGIN = 16;
  const TRANSITION_COOLDOWN = 0.22;

  // Game States
  const GameState = {
    TITLE: 'TITLE',
    PLAYING: 'PLAYING',
    DYING: 'DYING',
    STAGE_CLEAR: 'STAGE_CLEAR',
    GAME_OVER: 'GAME_OVER'
  };

  // =========================================================================
  // 2. CANVAS, OFFSCREEN LIGHT MASK & RESPONSIVE SIZING
  // =========================================================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const screenWrapper = document.getElementById('screenWrapper');
  const bezel = document.getElementById('bezel');

  // Dedicated 240x136 offscreen canvas for crisp destination-out headlamp lighting
  const lightCanvas = document.createElement('canvas');
  lightCanvas.width = SCREEN_W;
  lightCanvas.height = SCREEN_H;
  const lightCtx = lightCanvas.getContext('2d');

  ctx.imageSmoothingEnabled = false;
  lightCtx.imageSmoothingEnabled = false;

  function fitBezel() {
    try {
      const rect = screenWrapper.getBoundingClientRect();
      const availW = Math.max(240, rect.width - 16);
      const availH = Math.max(136, rect.height - 8);
      const scale = Math.min(availW / SCREEN_W, availH / SCREEN_H);
      const targetW = Math.max(240, Math.floor(SCREEN_W * scale));
      const targetH = Math.max(136, Math.floor(SCREEN_H * scale));
      bezel.style.width = targetW + 'px';
      bezel.style.height = targetH + 'px';
    } catch (e) {
      bezel.style.width = '480px';
      bezel.style.height = '272px';
    }
  }

  window.addEventListener('resize', fitBezel);
  window.addEventListener('orientationchange', fitBezel);

  // =========================================================================
  // 3. RETRO CHIPTUNE WEB AUDIO SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let audioEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playTone(type, freqStart, freqEnd, duration, gainVal = 0.12) {
    if (!audioEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd !== freqStart) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
      }
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) {}
  }

  function playNoise(duration, gainVal = 0.18) {
    if (!audioEnabled) return;
    initAudio();
    if (!audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const bufferSize = Math.floor(audioCtx.sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(750, now);
      filter.frequency.exponentialRampToValueAtTime(90, now + duration);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(gainVal, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    } catch (e) {}
  }

  const sfx = {
    laser: () => playTone('square', 920, 240, 0.08, 0.09),
    wallHit: () => playTone('triangle', 220, 95, 0.06, 0.11),
    placeBomb: () => playTone('sine', 420, 620, 0.07, 0.12),
    explosion: () => {
      playNoise(0.45, 0.25);
      playTone('sawtooth', 120, 32, 0.42, 0.2);
    },
    pickup: () => {
      playTone('square', 523, 784, 0.08, 0.1);
      setTimeout(() => playTone('square', 784, 1046, 0.12, 0.1), 70);
    },
    lanternBreak: () => {
      playNoise(0.15, 0.14);
      playTone('triangle', 600, 180, 0.14, 0.12);
    },
    hurt: () => {
      playNoise(0.3, 0.2);
      playTone('sawtooth', 300, 55, 0.35, 0.18);
    },
    rescue: () => {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, idx) => {
        setTimeout(() => playTone('square', n, n, 0.12, 0.11), idx * 90);
      });
    },
    rotor: () => playTone('triangle', 95, 115, 0.04, 0.035)
  };

  // =========================================================================
  // 4. PIXEL FONT & 8x8 SPRITE BITMAPS (SWEETIE-16 HEX INDICES)
  // =========================================================================
  const FONT_5X5 = {
    'A': ['01110','10001','11111','10001','10001'],
    'B': ['11110','10001','11110','10001','11110'],
    'C': ['01111','10000','10000','10000','01111'],
    'D': ['11110','10001','10001','10001','11110'],
    'E': ['11111','10000','11110','10000','11111'],
    'F': ['11111','10000','11110','10000','10000'],
    'G': ['01111','10000','10111','10001','01111'],
    'H': ['10001','10001','11111','10001','10001'],
    'I': ['11111','00100','00100','00100','11111'],
    'J': ['00111','00010','00010','10010','01100'],
    'K': ['10001','10010','11100','10010','10001'],
    'L': ['10000','10000','10000','10000','11111'],
    'M': ['10001','11011','10101','10001','10001'],
    'N': ['10001','11001','10101','10011','10001'],
    'O': ['01110','10001','10001','10001','01110'],
    'P': ['11110','10001','11110','10000','10000'],
    'Q': ['01110','10001','10101','10010','01101'],
    'R': ['11110','10001','11110','10010','10001'],
    'S': ['01111','10000','01110','00001','11110'],
    'T': ['11111','00100','00100','00100','00100'],
    'U': ['10001','10001','10001','10001','01110'],
    'V': ['10001','10001','10001','01010','00100'],
    'W': ['10001','10001','10101','11011','10001'],
    'X': ['10001','01010','00100','01010','10001'],
    'Y': ['10001','01010','00100','00100','00100'],
    'Z': ['11111','00010','00100','01000','11111'],
    '0': ['01110','10011','10101','11001','01110'],
    '1': ['00100','01100','00100','00100','01110'],
    '2': ['01110','10001','00110','01000','11111'],
    '3': ['11110','00001','01110','00001','11110'],
    '4': ['10010','10010','11111','00010','00010'],
    '5': ['11111','10000','11110','00001','11110'],
    '6': ['01110','10000','11110','10001','01110'],
    '7': ['11111','00001','00010','00100','00100'],
    '8': ['01110','10001','01110','10001','01110'],
    '9': ['01110','10001','01111','00001','01110'],
    ':': ['00000','00100','00000','00100','00000'],
    '-': ['00000','00000','11111','00000','00000'],
    '+': ['00000','00100','01110','00100','00000'],
    '/': ['00001','00010','00100','01000','10000'],
    '!': ['00100','00100','00100','00000','00100'],
    '[': ['01110','01000','01000','01000','01110'],
    ']': ['01110','00010','00010','00010','01110'],
    ',': ['00000','00000','00000','00100','01000'],
    ' ': ['00000','00000','00000','00000','00000']
  };

  function drawText(text, x, y, colorIdx = 12, align = 'left') {
    const str = String(text).toUpperCase();
    const charW = 6;
    const totalW = str.length * charW - 1;
    let drawX = Math.floor(x);
    if (align === 'center') drawX = Math.floor(x - totalW / 2);
    if (align === 'right') drawX = Math.floor(x - totalW);

    ctx.fillStyle = PAL[colorIdx];
    for (let i = 0; i < str.length; i++) {
      const glyph = FONT_5X5[str[i]] || FONT_5X5[' '];
      for (let r = 0; r < 5; r++) {
        const rowStr = glyph[r];
        for (let c = 0; c < 5; c++) {
          if (rowStr[c] === '1') {
            ctx.fillRect(drawX + i * charW + c, Math.floor(y) + r, 1, 1);
          }
        }
      }
    }
  }

  const SPRITES = {
    heroIdle: [
      '.cccccc.',
      '...c....',
      '..4444..',
      '.44bb44.',
      '.233332.',
      '.233332.',
      '..9999..',
      '..9..9..'
    ],
    heroFly: [
      'cccccccc',
      '...c....',
      '..4444..',
      '.44bb44.',
      '.233332.',
      '.233332.',
      '..9999..',
      '.9....9.'
    ],
    miner1: [
      '..4444..',
      '.444444.',
      '..3333..',
      '.a7777a.',
      '.a7777a.',
      '..8888..',
      '..8..8..',
      '.88..88.'
    ],
    miner2: [
      '..4444..',
      '.444444.',
      'a.3333.a',
      '.a7777a.',
      '..7777..',
      '..8888..',
      '..8..8..',
      '.88..88.'
    ],
    bat1: [
      '1......1',
      '11.22.11',
      '11124211',
      '.112211.',
      '..1..1..',
      '........',
      '........',
      '........'
    ],
    bat2: [
      '........',
      '..1221..',
      '.1124211',
      '11.22.11',
      '1......1',
      '........',
      '........',
      '........'
    ],
    spider: [
      '...ee...',
      '..2222..',
      '.242242.',
      '2.2222.2',
      '2..22..2',
      '.2....2.',
      '........',
      '........'
    ],
    snake: [
      '........',
      '....666.',
      '...65642',
      '..656...',
      '.656....',
      '666.....',
      '........',
      '........'
    ],
    lantern: [
      '...ee...',
      '..4444..',
      '.4cccc4.',
      '.4c44c4.',
      '.4cccc4.',
      '..4444..',
      '...ee...',
      '........'
    ],
    dynamite: [
      '....c4..',
      '...4....',
      '..222...',
      '.22422..',
      '.22222..',
      '.22422..',
      '..222...',
      '........'
    ],
    battery: [
      '..cccc..',
      '.666666.',
      '.655556.',
      '.654456.',
      '.654456.',
      '.655556.',
      '.666666.',
      '........'
    ],
    gem: [
      '...bb...',
      '..bccc..',
      '.baabcb.',
      '.baaaab.',
      '..baab..',
      '...bb...',
      '........',
      '........'
    ]
  };

  function drawSprite(name, x, y, flipX = false) {
    const bmp = SPRITES[name];
    if (!bmp) return;
    const px = Math.floor(x);
    const py = Math.floor(y);
    for (let r = 0; r < 8; r++) {
      const row = bmp[r];
      for (let c = 0; c < 8; c++) {
        const ch = row[flipX ? 7 - c : c];
        if (ch !== '.') {
          const idx = parseInt(ch, 16);
          ctx.fillStyle = PAL[idx];
          ctx.fillRect(px + c, py + r, 1, 1);
        }
      }
    }
  }

  // =========================================================================
  // 5. CLEAR-GUARANTEED PROCEDURAL CAVE GENERATOR
  // =========================================================================
  const STAGE_NAMES = [
    'UPPER SHAFT',
    'MAGMA FISSURE',
    'DARK LABYRINTH',
    'CRYSTAL CAVERN',
    'CORE MELTDOWN',
    'ABYSSAL SECTOR'
  ];

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function createEmptyRoomGrid() {
    const tiles = [];
    const wallHp = [];
    const protectedMask = [];
    for (let r = 0; r < ROWS; r++) {
      tiles.push(new Array(COLS).fill(T_ROCK));
      wallHp.push(new Array(COLS).fill(999));
      protectedMask.push(new Array(COLS).fill(false));
    }
    return {
      tiles,
      wallHp,
      protectedMask,
      entities: [],
      spawn: null,
      dark: false
    };
  }

  function carveTunnel(room, c1, r1, c2, r2, halfW = 1, halfH = 1, markProtected = true) {
    const stepC = c1 === c2 ? 0 : (c2 > c1 ? 1 : -1);
    const stepR = r1 === r2 ? 0 : (r2 > r1 ? 1 : -1);
    let c = c1;
    let r = r1;

    while (true) {
      for (let dr = -halfH; dr <= halfH; dr++) {
        for (let dc = -halfW; dc <= halfW; dc++) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 1 && nr <= ROWS - 2 && nc >= 1 && nc <= COLS - 2) {
            room.tiles[nr][nc] = T_EMPTY;
            room.wallHp[nr][nc] = 0;
            if (markProtected) {
              room.protectedMask[nr][nc] = true;
            }
          }
        }
      }
      if (c === c2 && r === r2) break;
      if (c !== c2) c += stepC;
      else if (r !== r2) r += stepR;
    }
  }

  function openBorderPortal(room, dir, centerCoord) {
    if (dir === 'right') {
      for (let dr = -1; dr <= 1; dr++) {
        const r = Math.max(1, Math.min(ROWS - 2, centerCoord + dr));
        for (let c = COLS - 3; c < COLS; c++) {
          room.tiles[r][c] = T_EMPTY;
          room.wallHp[r][c] = 0;
          room.protectedMask[r][c] = true;
        }
      }
    } else if (dir === 'left') {
      for (let dr = -1; dr <= 1; dr++) {
        const r = Math.max(1, Math.min(ROWS - 2, centerCoord + dr));
        for (let c = 0; c <= 2; c++) {
          room.tiles[r][c] = T_EMPTY;
          room.wallHp[r][c] = 0;
          room.protectedMask[r][c] = true;
        }
      }
    } else if (dir === 'down') {
      for (let dc = -1; dc <= 1; dc++) {
        const c = Math.max(1, Math.min(COLS - 2, centerCoord + dc));
        for (let r = ROWS - 3; r < ROWS; r++) {
          room.tiles[r][c] = T_EMPTY;
          room.wallHp[r][c] = 0;
          room.protectedMask[r][c] = true;
        }
      }
    } else if (dir === 'up') {
      for (let dc = -1; dc <= 1; dc++) {
        const c = Math.max(1, Math.min(COLS - 2, centerCoord + dc));
        for (let r = 0; r <= 2; r++) {
          room.tiles[r][c] = T_EMPTY;
          room.wallHp[r][c] = 0;
          room.protectedMask[r][c] = true;
        }
      }
    }
  }

  /**
   * Seals 100% of a corridor cross-section with T_DIRT so there are zero bypass gaps.
   */
  function placeAirtightBarrier(room, cCenter, rCenter, isHorizontalCorridor) {
    let placedCount = 0;
    if (isHorizontalCorridor) {
      let rTop = rCenter;
      while (rTop > 0 && room.tiles[rTop - 1][cCenter] === T_EMPTY) rTop--;
      let rBot = rCenter;
      while (rBot < ROWS - 1 && room.tiles[rBot + 1][cCenter] === T_EMPTY) rBot++;

      if (rTop <= 0 || rBot >= ROWS - 1 || cCenter < 4 || cCenter > COLS - 5) return false;
      if (rBot - rTop > 5) return false;

      for (let r = rTop; r <= rBot; r++) {
        for (let dc = 0; dc <= 1; dc++) {
          if (room.tiles[r][cCenter + dc] === T_EMPTY) {
            room.tiles[r][cCenter + dc] = T_DIRT;
            room.wallHp[r][cCenter + dc] = 4;
            placedCount++;
          }
        }
      }
    } else {
      let cLeft = cCenter;
      while (cLeft > 0 && room.tiles[rCenter][cLeft - 1] === T_EMPTY) cLeft--;
      let cRight = cCenter;
      while (cRight < COLS - 1 && room.tiles[rCenter][cRight + 1] === T_EMPTY) cRight++;

      if (cLeft <= 0 || cRight >= COLS - 1 || rCenter < 3 || rCenter > ROWS - 4) return false;
      if (cRight - cLeft > 6) return false;

      for (let c = cLeft; c <= cRight; c++) {
        for (let dr = 0; dr <= 1; dr++) {
          if (room.tiles[rCenter + dr][c] === T_EMPTY) {
            room.tiles[rCenter + dr][c] = T_DIRT;
            room.wallHp[rCenter + dr][c] = 4;
            placedCount++;
          }
        }
      }
    }
    return placedCount > 0;
  }

  function generateProceduralStage(stageNumber) {
    const roomCount = Math.min(8, 3 + stageNumber);
    const rooms = {};
    const pathCoords = [];

    let rx = 0;
    let ry = 0;
    pathCoords.push({ x: rx, y: ry });

    const dirs = [
      { dx: 1, dy: 0, out: 'right', opp: 'left' },
      { dx: -1, dy: 0, out: 'left', opp: 'right' },
      { dx: 0, dy: 1, out: 'down', opp: 'up' }
    ];

    let guard = 0;
    while (pathCoords.length < roomCount && guard < 120) {
      guard++;
      const validDirs = dirs.filter((d) => {
        const nx = rx + d.dx;
        const ny = ry + d.dy;
        if (nx < 0 || nx > 3 || ny < 0 || ny > 3) return false;
        return !pathCoords.some((p) => p.x === nx && p.y === ny);
      });
      if (validDirs.length === 0) break;
      const chosen = validDirs[randInt(0, validDirs.length - 1)];
      rx += chosen.dx;
      ry += chosen.dy;
      pathCoords.push({ x: rx, y: ry });
    }

    pathCoords.forEach((p) => {
      rooms[`${p.x},${p.y}`] = createEmptyRoomGrid();
    });

    const connections = [];
    for (let i = 0; i < pathCoords.length - 1; i++) {
      const curr = pathCoords[i];
      const next = pathCoords[i + 1];
      const dx = next.x - curr.x;
      const dy = next.y - curr.y;

      if (dx === 1) {
        connections.push({ fromDir: 'right', toDir: 'left', coord: randInt(3, ROWS - 4) });
      } else if (dx === -1) {
        connections.push({ fromDir: 'left', toDir: 'right', coord: randInt(3, ROWS - 4) });
      } else if (dy === 1) {
        connections.push({ fromDir: 'down', toDir: 'up', coord: randInt(4, COLS - 5) });
      }
    }

    let totalBarriersPlaced = 0;

    for (let i = 0; i < pathCoords.length; i++) {
      const p = pathCoords[i];
      const room = rooms[`${p.x},${p.y}`];
      const inConn = i > 0 ? connections[i - 1] : null;
      const outConn = i < connections.length ? connections[i] : null;

      let entryC = 3;
      let entryR = 3;
      if (!inConn) {
        room.spawn = { x: entryC * TILE_SIZE + 1, y: PLAY_Y0 + entryR * TILE_SIZE };
      } else {
        openBorderPortal(room, inConn.toDir, inConn.coord);
        if (inConn.toDir === 'left') { entryC = 2; entryR = inConn.coord; }
        else if (inConn.toDir === 'right') { entryC = COLS - 3; entryR = inConn.coord; }
        else if (inConn.toDir === 'up') { entryC = inConn.coord; entryR = 2; }
      }

      let exitC = COLS - 4;
      let exitR = ROWS - 4;
      if (outConn) {
        openBorderPortal(room, outConn.fromDir, outConn.coord);
        if (outConn.fromDir === 'right') { exitC = COLS - 3; exitR = outConn.coord; }
        else if (outConn.fromDir === 'left') { exitC = 2; exitR = outConn.coord; }
        else if (outConn.fromDir === 'down') { exitC = outConn.coord; exitR = ROWS - 3; }
      } else {
        exitC = entryC < COLS / 2 ? COLS - 4 : 3;
        exitR = randInt(4, ROWS - 4);
      }

      // Main 3x3 walkable corridor
      const midC = randInt(7, COLS - 8);
      const midR = randInt(3, ROWS - 4);

      carveTunnel(room, entryC, entryR, midC, entryR, 1, 1, true);
      carveTunnel(room, midC, entryR, midC, midR, 1, 1, true);
      carveTunnel(room, midC, midR, exitC, midR, 1, 1, true);
      carveTunnel(room, exitC, midR, exitC, exitR, 1, 1, true);

      // Optional side pocket with Energy Capsule (+45 POWER) or Treasure Gem (+500 PTS)
      if (Math.random() < 0.75) {
        const pocketC = randInt(5, COLS - 6);
        const pocketR = randInt(3, ROWS - 4);
        carveTunnel(room, midC, midR, pocketC, pocketR, 1, 1, false);
        if (room.tiles[pocketR][pocketC] === T_EMPTY) {
          const itemType = Math.random() < 0.6 ? 'battery' : 'gem';
          room.entities.push({
            type: itemType,
            x: pocketC * TILE_SIZE,
            y: PLAY_Y0 + pocketR * TILE_SIZE,
            w: 8,
            h: 8,
            alive: true
          });
        }
      }

      // Starting ledge in Room 0
      if (i === 0) {
        const platR = entryR + 2;
        if (platR < ROWS - 1) {
          for (let c = 1; c <= 5; c++) {
            if (room.tiles[platR][c] === T_EMPTY) {
              room.tiles[platR][c] = T_SUPPORT;
            }
          }
        }
      }

      // Airtight destructible barrier on straight corridor segment
      const shouldPlaceBarrier = i === pathCoords.length - 1 || Math.random() < 0.72;
      if (shouldPlaceBarrier) {
        let placed = false;
        const testC = Math.floor((midC + exitC) / 2);
        if (Math.abs(exitC - midC) >= 6) {
          placed = placeAirtightBarrier(room, testC, midR, true);
        }
        if (!placed && Math.abs(midR - entryR) >= 5) {
          const testR = Math.floor((entryR + midR) / 2);
          placed = placeAirtightBarrier(room, midC, testR, false);
        }
        if (placed) {
          totalBarriersPlaced++;
        }
      }

      // Trapped Miner in final room
      if (!outConn) {
        carveTunnel(room, exitC, exitR, exitC, exitR, 1, 1, true);
        room.entities.push({
          type: 'miner',
          x: exitC * TILE_SIZE,
          y: PLAY_Y0 + exitR * TILE_SIZE,
          w: 8,
          h: 8,
          alive: true
        });
      }

      // Hanging Ceiling Lantern
      let lanternPlaced = false;
      for (let c = 5; c < COLS - 5 && !lanternPlaced; c++) {
        for (let r = 1; r < ROWS - 4; r++) {
          if (
            room.tiles[r][c] === T_ROCK &&
            room.tiles[r + 1][c] === T_EMPTY &&
            room.tiles[r + 2][c] === T_EMPTY
          ) {
            room.entities.push({
              type: 'lantern',
              x: c * TILE_SIZE,
              y: PLAY_Y0 + (r + 1) * TILE_SIZE,
              w: 8,
              h: 8,
              alive: true
            });
            lanternPlaced = true;
            break;
          }
        }
      }

      // Enemies (Bats, Spiders, Snakes)
      const enemyBudget = Math.min(3, 1 + Math.floor(stageNumber / 2));
      let spawnedEnemies = 0;
      for (let tries = 0; tries < 45 && spawnedEnemies < enemyBudget; tries++) {
        const ec = randInt(5, COLS - 6);
        const er = randInt(2, ROWS - 4);
        if (room.tiles[er][ec] !== T_EMPTY) continue;
        if (Math.hypot(ec - entryC, er - entryR) < 5) continue;
        if (Math.hypot(ec - exitC, er - exitR) < 4) continue;

        const roll = Math.random();
        if (roll < 0.45) {
          room.entities.push({
            type: 'bat',
            x: ec * TILE_SIZE,
            y: PLAY_Y0 + er * TILE_SIZE,
            w: 8,
            h: 6,
            vx: (Math.random() < 0.5 ? 1 : -1) * (22 + stageNumber * 2),
            alive: true
          });
          spawnedEnemies++;
        } else if (roll < 0.78 && room.tiles[er - 1][ec] === T_ROCK && room.tiles[er + 1][ec] === T_EMPTY) {
          room.entities.push({
            type: 'spider',
            x: ec * TILE_SIZE,
            y: PLAY_Y0 + er * TILE_SIZE,
            w: 8,
            h: 6,
            startY: PLAY_Y0 + er * TILE_SIZE,
            vy: 18 + stageNumber * 2,
            alive: true
          });
          spawnedEnemies++;
        } else if (room.tiles[er + 1][ec] === T_ROCK) {
          room.entities.push({
            type: 'snake',
            x: ec * TILE_SIZE,
            y: PLAY_Y0 + er * TILE_SIZE + 2,
            w: 8,
            h: 6,
            vx: (Math.random() < 0.5 ? 1 : -1) * 14,
            alive: true
          });
          spawnedEnemies++;
        }
      }

      // Magma Floor Patches on Stage 2+
      if (stageNumber >= 1) {
        for (let c = 4; c < COLS - 4; c++) {
          for (let r = 4; r < ROWS - 1; r++) {
            if (
              room.tiles[r][c] === T_ROCK &&
              !room.protectedMask[r][c] &&
              room.tiles[r - 1][c] === T_EMPTY &&
              Math.abs(c - entryC) > 4 &&
              Math.abs(c - exitC) > 4 &&
              Math.random() < 0.14
            ) {
              room.tiles[r][c] = T_MAGMA;
            }
          }
        }
      }
    }

    return {
      name: `STAGE ${stageNumber + 1}: ${STAGE_NAMES[stageNumber % STAGE_NAMES.length]}`,
      startRoom: '0,0',
      dynamite: Math.max(3, totalBarriersPlaced + 2),
      rooms
    };
  }

  // =========================================================================
  // 6. GAME STATE, PLAYER & ENTITIES
  // =========================================================================
  let state = GameState.TITLE;
  let stateTimer = 0;
  let globalTick = 0;
  let score = 0;
  let highScore = 0;
  let lives = 3;
  let stageIdx = 0;
  let currentStageDef = null;
  let stageRooms = {};
  let currentRoomKey = '0,0';
  let screenShake = 0;

  const player = {
    x: 24,
    y: 40,
    w: 6,
    h: 8,
    vx: 0,
    vy: 0,
    facing: 1,
    onGround: false,
    flying: false,
    power: 100,
    dynamite: 4,
    laserCooldown: 0,
    bombCooldown: 0,
    invuln: 0,
    transitionCooldown: 0
  };

  let lasers = [];
  let bombs = [];
  let explosions = [];
  let particles = [];

  // =========================================================================
  // 7. INPUT HANDLING (KEYBOARD + ANTI-HAPTIC MOBILE TOUCH)
  // =========================================================================
  const keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    laser: false,
    bomb: false
  };
  const prevKeys = { ...keys };

  window.addEventListener('keydown', (e) => {
    initAudio();
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = true;
    if (k === 'arrowright' || k === 'd') keys.right = true;
    if (k === 'arrowup' || k === 'w') keys.up = true;
    if (k === 'arrowdown' || k === 's') keys.down = true;
    if (k === 'z' || k === ' ' || k === 'enter') keys.laser = true;
    if (k === 'x' || k === 'shift') keys.bomb = true;
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
    if (k === 'arrowup' || k === 'w') keys.up = false;
    if (k === 'arrowdown' || k === 's') keys.down = false;
    if (k === 'z' || k === ' ' || k === 'enter') keys.laser = false;
    if (k === 'x' || k === 'shift') keys.bomb = false;
  });

  function setupTouchControls() {
    const activeTouches = new Map();
    const audioBtn = document.getElementById('audioToggle');

    // Suppress long-press context menu and OS haptic callouts everywhere
    const suppressContextMenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      return false;
    };
    window.addEventListener('contextmenu', suppressContextMenu, { passive: false });
    document.addEventListener('contextmenu', suppressContextMenu, { passive: false });
    document.querySelectorAll('.pad-btn, .act-btn, .bezel, canvas, button').forEach((el) => {
      el.addEventListener('contextmenu', suppressContextMenu, { passive: false });
    });

    function updateTouchState() {
      keys.left = false;
      keys.right = false;
      keys.up = false;
      keys.down = false;
      keys.laser = false;
      keys.bomb = false;

      document.querySelectorAll('.pad-btn, .act-btn').forEach((el) => el.classList.remove('active'));

      activeTouches.forEach((keyName) => {
        if (keyName && Object.prototype.hasOwnProperty.call(keys, keyName)) {
          keys[keyName] = true;
          const btn = document.querySelector(`[data-key="${keyName}"]`);
          if (btn) btn.classList.add('active');
        }
      });
    }

    function resolveKeyAtPoint(clientX, clientY) {
      const el = document.elementFromPoint(clientX, clientY);
      if (!el) return null;
      const btn = el.closest('[data-key]');
      return btn ? btn.getAttribute('data-key') : null;
    }

    document.addEventListener('touchstart', (e) => {
      // Allow sound button tap, prevent browser default long-press selection/vibration elsewhere
      if (!e.target.closest('#audioToggle')) {
        e.preventDefault();
      }
      initAudio();

      if (state === GameState.TITLE || state === GameState.GAME_OVER) {
        if (e.target.closest('.bezel')) {
          startNewGame();
          return;
        }
      }
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const keyName = resolveKeyAtPoint(t.clientX, t.clientY);
        if (keyName) {
          activeTouches.set(t.identifier, keyName);
        }
      }
      updateTouchState();
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        if (activeTouches.has(t.identifier)) {
          const keyName = resolveKeyAtPoint(t.clientX, t.clientY);
          activeTouches.set(t.identifier, keyName);
        }
      }
      updateTouchState();
    }, { passive: false });

    const endTouch = (e) => {
      if (!e.target.closest('#audioToggle')) {
        e.preventDefault();
      }
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      updateTouchState();
    };

    document.addEventListener('touchend', endTouch, { passive: false });
    document.addEventListener('touchcancel', endTouch, { passive: false });

    // Desktop click on bezel to start
    bezel.addEventListener('mousedown', (e) => {
      e.preventDefault();
      initAudio();
      if (state === GameState.TITLE || state === GameState.GAME_OVER) {
        startNewGame();
      }
    });

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audioEnabled = !audioEnabled;
      audioBtn.textContent = audioEnabled ? 'SOUND: ON' : 'SOUND: OFF';
      if (audioEnabled) initAudio();
    });
  }

  // =========================================================================
  // 8. STAGE & ROOM MANAGEMENT
  // =========================================================================
  function loadStage(idx, resetResources = true) {
    stageIdx = idx;
    currentStageDef = generateProceduralStage(stageIdx);
    stageRooms = currentStageDef.rooms;
    currentRoomKey = currentStageDef.startRoom;

    const startRoom = stageRooms[currentRoomKey];
    player.x = startRoom.spawn ? startRoom.spawn.x : 24;
    player.y = startRoom.spawn ? startRoom.spawn.y : PLAY_Y0 + 24;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.power = 100;
    if (resetResources) {
      player.dynamite = currentStageDef.dynamite;
    } else {
      player.dynamite = Math.max(player.dynamite, currentStageDef.dynamite);
    }
    player.invuln = 1.0;
    player.transitionCooldown = TRANSITION_COOLDOWN;

    lasers = [];
    bombs = [];
    explosions = [];
    particles = [];
  }

  function startNewGame() {
    score = 0;
    lives = 3;
    loadStage(0, true);
    state = GameState.PLAYING;
  }

  function restartAfterLifeLost() {
    currentRoomKey = currentStageDef.startRoom;
    const startRoom = stageRooms[currentRoomKey];
    player.x = startRoom.spawn ? startRoom.spawn.x : 24;
    player.y = startRoom.spawn ? startRoom.spawn.y : PLAY_Y0 + 24;
    player.vx = 0;
    player.vy = 0;
    player.power = 100;
    player.dynamite = Math.max(player.dynamite, currentStageDef.dynamite);
    player.invuln = 1.4;
    player.transitionCooldown = TRANSITION_COOLDOWN;
    lasers = [];
    bombs = [];
    explosions = [];
    particles = [];
    state = GameState.PLAYING;
  }

  function spawnParticles(x, y, colorIdx, count = 8, speed = 50) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (0.3 + Math.random() * 0.7) * speed;
      particles.push({
        x,
        y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 0.25 + Math.random() * 0.3,
        color: colorIdx
      });
    }
  }

  // =========================================================================
  // 9. TILE COLLISION & DAMAGE HELPERS
  // =========================================================================
  function getTileAt(room, px, py) {
    const c = Math.floor(px / TILE_SIZE);
    const r = Math.floor((py - PLAY_Y0) / TILE_SIZE);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return T_EMPTY;
    return room.tiles[r][c];
  }

  function isSolidTile(t) {
    return t === T_ROCK || t === T_DIRT || t === T_MAGMA || t === T_SUPPORT;
  }

  function checkBoxCollision(room, x, y, w, h) {
    const pts = [
      [x, y],
      [x + w - 0.01, y],
      [x, y + h - 0.01],
      [x + w - 0.01, y + h - 0.01]
    ];
    let hitSolid = false;
    let hitMagma = false;
    for (const [px, py] of pts) {
      const t = getTileAt(room, px, py);
      if (t === T_MAGMA) hitMagma = true;
      if (isSolidTile(t)) hitSolid = true;
    }
    return { hitSolid, hitMagma };
  }

  function damageDirtTile(room, c, r, dmg) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    if (room.tiles[r][c] !== T_DIRT) return;
    room.wallHp[r][c] -= dmg;
    spawnParticles(c * TILE_SIZE + 4, PLAY_Y0 + r * TILE_SIZE + 4, 3, 5, 35);
    if (room.wallHp[r][c] <= 0) {
      room.tiles[r][c] = T_EMPTY;
      room.wallHp[r][c] = 0;
      score += 25;
      sfx.wallHit();
      spawnParticles(c * TILE_SIZE + 4, PLAY_Y0 + r * TILE_SIZE + 4, 2, 10, 55);
    } else {
      sfx.wallHit();
    }
  }

  function triggerBombExplosion(room, bx, by) {
    sfx.explosion();
    screenShake = 0.25;
    const blastR = 20;
    explosions.push({ x: bx, y: by, r: blastR, life: 0.28 });
    spawnParticles(bx, by, 4, 16, 75);
    spawnParticles(bx, by, 3, 14, 55);

    const cMin = Math.max(0, Math.floor((bx - blastR) / TILE_SIZE));
    const cMax = Math.min(COLS - 1, Math.floor((bx + blastR) / TILE_SIZE));
    const rMin = Math.max(0, Math.floor((by - PLAY_Y0 - blastR) / TILE_SIZE));
    const rMax = Math.min(ROWS - 1, Math.floor((by - PLAY_Y0 + blastR) / TILE_SIZE));

    for (let r = rMin; r <= rMax; r++) {
      for (let c = cMin; c <= cMax; c++) {
        if (room.tiles[r][c] === T_DIRT) {
          damageDirtTile(room, c, r, 99);
        }
      }
    }

    room.entities.forEach((ent) => {
      if (!ent.alive || ent.type === 'miner' || ent.type === 'battery' || ent.type === 'gem') return;
      const ex = ent.x + ent.w / 2;
      const ey = ent.y + ent.h / 2;
      if (Math.hypot(ex - bx, ey - by) <= blastR + 4) {
        ent.alive = false;
        if (ent.type === 'lantern') {
          room.dark = true;
        } else {
          score += 100;
        }
        spawnParticles(ex, ey, 2, 10, 60);
      }
    });

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    if (Math.hypot(px - bx, py - by) <= blastR - 2 && player.invuln <= 0) {
      killPlayer();
    }
  }

  function killPlayer() {
    if (state !== GameState.PLAYING) return;
    sfx.hurt();
    screenShake = 0.3;
    spawnParticles(player.x + 3, player.y + 4, 2, 18, 70);
    lives--;
    state = GameState.DYING;
    stateTimer = 1.4;
  }

  // =========================================================================
  // 10. MAIN UPDATE LOOP
  // =========================================================================
  function update(dt) {
    globalTick += dt;
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt);

    const laserJustPressed = keys.laser && !prevKeys.laser;
    const bombJustPressed = keys.bomb && !prevKeys.bomb;

    if (state === GameState.TITLE) {
      if (laserJustPressed || bombJustPressed) {
        startNewGame();
      }
      Object.assign(prevKeys, keys);
      return;
    }

    if (state === GameState.GAME_OVER) {
      stateTimer -= dt;
      if (stateTimer <= 0 && (laserJustPressed || bombJustPressed)) {
        startNewGame();
      }
      Object.assign(prevKeys, keys);
      return;
    }

    if (state === GameState.DYING) {
      stateTimer -= dt;
      updateParticles(dt);
      if (stateTimer <= 0) {
        if (lives > 0) {
          restartAfterLifeLost();
        } else {
          state = GameState.GAME_OVER;
          stateTimer = 0.6;
        }
      }
      Object.assign(prevKeys, keys);
      return;
    }

    if (state === GameState.STAGE_CLEAR) {
      stateTimer -= dt;
      updateParticles(dt);
      if (stateTimer <= 0) {
        loadStage(stageIdx + 1, false);
        state = GameState.PLAYING;
      }
      Object.assign(prevKeys, keys);
      return;
    }

    // Active Gameplay
    const room = stageRooms[currentRoomKey];
    if (!room) return;

    if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);
    if (player.laserCooldown > 0) player.laserCooldown = Math.max(0, player.laserCooldown - dt);
    if (player.bombCooldown > 0) player.bombCooldown = Math.max(0, player.bombCooldown - dt);
    if (player.transitionCooldown > 0) player.transitionCooldown = Math.max(0, player.transitionCooldown - dt);

    // Horizontal Movement
    const moveSpeed = 54;
    if (keys.left) {
      player.vx = -moveSpeed;
      player.facing = -1;
    } else if (keys.right) {
      player.vx = moveSpeed;
      player.facing = 1;
    } else {
      player.vx = 0;
    }

    // Vertical Propeller Thrust vs Gravity
    const gravity = 82;
    const thrustAccel = -175;
    const maxRise = -62;
    const maxFall = 78;

    player.flying = keys.up || !player.onGround;
    if (keys.up) {
      player.vy = Math.max(maxRise, player.vy + thrustAccel * dt);
      if (Math.floor(globalTick * 24) % 3 === 0) sfx.rotor();
    } else {
      const fallBoost = keys.down ? 1.35 : 1.0;
      player.vy = Math.min(maxFall, player.vy + gravity * fallBoost * dt);
    }

    // Power Drain (Base + Thrusting)
    const drainRate = keys.up ? 3.2 : (player.flying ? 2.1 : 1.35);
    player.power = Math.max(0, player.power - drainRate * dt);
    if (player.power <= 0) {
      killPlayer();
      Object.assign(prevKeys, keys);
      return;
    }

    // Move & Collide X
    const nextX = player.x + player.vx * dt;
    const colX = checkBoxCollision(room, nextX, player.y, player.w, player.h);
    if (colX.hitMagma && player.invuln <= 0) {
      killPlayer();
      Object.assign(prevKeys, keys);
      return;
    }
    if (!colX.hitSolid) {
      player.x = nextX;
    }

    // Move & Collide Y
    const nextY = player.y + player.vy * dt;
    const colY = checkBoxCollision(room, player.x, nextY, player.w, player.h);
    if (colY.hitMagma && player.invuln <= 0) {
      killPlayer();
      Object.assign(prevKeys, keys);
      return;
    }
    if (!colY.hitSolid) {
      player.y = nextY;
      player.onGround = false;
    } else {
      if (player.vy > 0) player.onGround = true;
      player.vy = 0;
    }

    // Room Transitions (Smooth with ENTRY_MARGIN=16 & TRANSITION_COOLDOWN=0.22s)
    const [rx, ry] = currentRoomKey.split(',').map(Number);
    if (player.transitionCooldown <= 0) {
      if (player.x + player.w > SCREEN_W - 2) {
        const targetKey = `${rx + 1},${ry}`;
        if (stageRooms[targetKey]) {
          currentRoomKey = targetKey;
          player.x = ENTRY_MARGIN;
          player.vx = 0;
          player.transitionCooldown = TRANSITION_COOLDOWN;
        } else {
          player.x = SCREEN_W - player.w - 2;
        }
      } else if (player.x < 2) {
        const targetKey = `${rx - 1},${ry}`;
        if (stageRooms[targetKey]) {
          currentRoomKey = targetKey;
          player.x = SCREEN_W - player.w - ENTRY_MARGIN;
          player.vx = 0;
          player.transitionCooldown = TRANSITION_COOLDOWN;
        } else {
          player.x = 2;
        }
      } else if (player.y + player.h > SCREEN_H - 2) {
        const targetKey = `${rx},${ry + 1}`;
        if (stageRooms[targetKey]) {
          currentRoomKey = targetKey;
          player.y = PLAY_Y0 + ENTRY_MARGIN;
          player.vy = 0;
          player.transitionCooldown = TRANSITION_COOLDOWN;
        } else {
          player.y = SCREEN_H - player.h - 2;
        }
      } else if (player.y < PLAY_Y0 + 2) {
        const targetKey = `${rx},${ry - 1}`;
        if (stageRooms[targetKey]) {
          currentRoomKey = targetKey;
          player.y = SCREEN_H - player.h - ENTRY_MARGIN;
          player.vy = 0;
          player.transitionCooldown = TRANSITION_COOLDOWN;
        } else {
          player.y = PLAY_Y0 + 2;
        }
      }
    }

    // Fire Helmet Laser or Place Dynamite
    const wantBomb = bombJustPressed || (keys.down && laserJustPressed);
    if (wantBomb && player.dynamite > 0 && player.bombCooldown <= 0) {
      player.dynamite--;
      player.bombCooldown = 0.35;
      sfx.placeBomb();
      bombs.push({
        x: player.x + 1,
        y: player.y + 1,
        timer: 1.5
      });
    } else if (laserJustPressed && !keys.down && player.laserCooldown <= 0 && player.power > 1.5) {
      player.power = Math.max(0, player.power - 1.4);
      player.laserCooldown = 0.16;
      sfx.laser();
      lasers.push({
        x: player.facing === 1 ? player.x + player.w : player.x - 6,
        y: player.y + 2,
        vx: player.facing * 195,
        life: 0.45
      });
    }

    // Update Lasers
    const activeRoom = stageRooms[currentRoomKey];
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.x += l.vx * dt;
      l.life -= dt;
      if (l.life <= 0 || l.x < 0 || l.x > SCREEN_W) {
        lasers.splice(i, 1);
        continue;
      }

      const checkX = l.vx > 0 ? l.x + 6 : l.x;
      const c = Math.floor(checkX / TILE_SIZE);
      const r = Math.floor((l.y - PLAY_Y0) / TILE_SIZE);
      if (c >= 0 && c < COLS && r >= 0 && r < ROWS) {
        const t = activeRoom.tiles[r][c];
        if (t === T_DIRT) {
          damageDirtTile(activeRoom, c, r, 1);
          lasers.splice(i, 1);
          continue;
        } else if (t === T_ROCK || t === T_MAGMA) {
          spawnParticles(checkX, l.y, 11, 3, 30);
          lasers.splice(i, 1);
          continue;
        }
      }

      let hitEnt = false;
      for (const ent of activeRoom.entities) {
        if (!ent.alive || ent.type === 'miner' || ent.type === 'battery' || ent.type === 'gem') continue;
        if (
          l.x + 6 > ent.x &&
          l.x < ent.x + ent.w &&
          l.y + 2 > ent.y &&
          l.y < ent.y + ent.h
        ) {
          ent.alive = false;
          hitEnt = true;
          if (ent.type === 'lantern') {
            activeRoom.dark = true;
            sfx.lanternBreak();
            spawnParticles(ent.x + 4, ent.y + 4, 4, 10, 45);
          } else {
            score += 100;
            sfx.wallHit();
            spawnParticles(ent.x + 4, ent.y + 4, 2, 10, 50);
          }
          break;
        }
      }
      if (hitEnt) lasers.splice(i, 1);
    }

    // Update Dynamite Bombs
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.timer -= dt;
      if (b.timer <= 0) {
        bombs.splice(i, 1);
        triggerBombExplosion(activeRoom, b.x + 3, b.y + 3);
      }
    }

    // Update Explosions & Particles
    for (let i = explosions.length - 1; i >= 0; i--) {
      explosions[i].life -= dt;
      if (explosions[i].life <= 0) explosions.splice(i, 1);
    }
    updateParticles(dt);

    // Update Room Entities
    for (const ent of activeRoom.entities) {
      if (!ent.alive) continue;

      if (ent.type === 'bat') {
        const nx = ent.x + ent.vx * dt;
        const c = Math.floor((ent.vx > 0 ? nx + ent.w : nx) / TILE_SIZE);
        const r = Math.floor((ent.y - PLAY_Y0 + 3) / TILE_SIZE);
        if (c <= 1 || c >= COLS - 2 || isSolidTile(activeRoom.tiles[r]?.[c])) {
          ent.vx = -ent.vx;
        } else {
          ent.x = nx;
        }
      } else if (ent.type === 'spider') {
        const ny = ent.y + ent.vy * dt;
        const r = Math.floor((ent.vy > 0 ? ny + ent.h : ny - PLAY_Y0) / TILE_SIZE);
        const c = Math.floor((ent.x + 4) / TILE_SIZE);
        if (
          ny < ent.startY ||
          ny > ent.startY + 34 ||
          r >= ROWS - 1 ||
          isSolidTile(activeRoom.tiles[r]?.[c])
        ) {
          ent.vy = -ent.vy;
        } else {
          ent.y = ny;
        }
      } else if (ent.type === 'snake') {
        const nx = ent.x + ent.vx * dt;
        const frontC = Math.floor((ent.vx > 0 ? nx + ent.w : nx) / TILE_SIZE);
        const bodyR = Math.floor((ent.y - PLAY_Y0 + 3) / TILE_SIZE);
        const floorR = bodyR + 1;
        if (
          frontC <= 1 ||
          frontC >= COLS - 2 ||
          isSolidTile(activeRoom.tiles[bodyR]?.[frontC]) ||
          !isSolidTile(activeRoom.tiles[floorR]?.[frontC])
        ) {
          ent.vx = -ent.vx;
        } else {
          ent.x = nx;
        }
      }

      // Check Player Overlap
      const overlap =
        player.x + player.w > ent.x + 1 &&
        player.x < ent.x + ent.w - 1 &&
        player.y + player.h > ent.y + 1 &&
        player.y < ent.y + ent.h - 1;

      if (overlap) {
        if (ent.type === 'miner') {
          sfx.rescue();
          const energyBonus = Math.round(player.power) * 10;
          const bombBonus = player.dynamite * 150;
          score += 500 + energyBonus + bombBonus;
          if (score > highScore) highScore = score;
          state = GameState.STAGE_CLEAR;
          stateTimer = 2.2;
          return;
        } else if (ent.type === 'battery') {
          ent.alive = false;
          player.power = Math.min(100, player.power + 45);
          score += 150;
          sfx.pickup();
          spawnParticles(ent.x + 4, ent.y + 4, 5, 10, 45);
        } else if (ent.type === 'gem') {
          ent.alive = false;
          score += 500;
          sfx.pickup();
          spawnParticles(ent.x + 4, ent.y + 4, 11, 12, 50);
        } else if (ent.type === 'lantern') {
          ent.alive = false;
          activeRoom.dark = true;
          sfx.lanternBreak();
          spawnParticles(ent.x + 4, ent.y + 4, 4, 10, 45);
        } else if (player.invuln <= 0) {
          killPlayer();
          return;
        }
      }
    }

    Object.assign(prevKeys, keys);
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // =========================================================================
  // 11. TIC-80 PIXEL RENDERER (OFFSCREEN DESTINATION-OUT HEADLAMP CONE)
  // =========================================================================
  function renderDarknessMask(room) {
    lightCtx.save();
    lightCtx.globalCompositeOperation = 'source-over';
    lightCtx.clearRect(0, 0, SCREEN_W, SCREEN_H);

    // Fill playfield area with void black
    lightCtx.fillStyle = PAL[0];
    lightCtx.fillRect(0, PLAY_Y0, SCREEN_W, PLAY_H);

    // Punch out illuminated regions using destination-out
    lightCtx.globalCompositeOperation = 'destination-out';
    lightCtx.fillStyle = '#ffffff';

    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;

    // 1. Soft circular aura around the player
    lightCtx.beginPath();
    lightCtx.arc(px, py, 20, 0, Math.PI * 2);
    lightCtx.fill();

    // 2. Symmetrical directional headlamp beam (Left & Right)
    const helmX = px + player.facing * 3;
    const helmY = py - 1;
    const coneLen = 115;
    const halfSpread = 0.45; // radians (~26 deg up and down)
    const centerAngle = player.facing === 1 ? 0 : Math.PI;

    lightCtx.beginPath();
    lightCtx.moveTo(helmX, helmY);
    lightCtx.arc(helmX, helmY, coneLen, centerAngle - halfSpread, centerAngle + halfSpread);
    lightCtx.closePath();
    lightCtx.fill();

    // 3. Subtle glow around active dynamite sticks & explosions
    for (const b of bombs) {
      lightCtx.beginPath();
      lightCtx.arc(b.x + 4, b.y + 4, 16, 0, Math.PI * 2);
      lightCtx.fill();
    }
    for (const ex of explosions) {
      lightCtx.beginPath();
      lightCtx.arc(ex.x, ex.y, ex.r + 14, 0, Math.PI * 2);
      lightCtx.fill();
    }

    lightCtx.restore();

    // Blit light mask onto main canvas
    ctx.drawImage(lightCanvas, 0, 0);
  }

  function render() {
    ctx.fillStyle = PAL[0];
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    const room = stageRooms[currentRoomKey];
    if (!room) return;

    ctx.save();
    if (screenShake > 0) {
      const sx = Math.round((Math.random() - 0.5) * 4);
      const sy = Math.round((Math.random() - 0.5) * 4);
      ctx.translate(sx, sy);
    }

    // 1. Render Cave Tiles
    const pulse = Math.floor(globalTick * 6) % 2 === 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = room.tiles[r][c];
        const tx = c * TILE_SIZE;
        const ty = PLAY_Y0 + r * TILE_SIZE;

        if (t === T_ROCK) {
          ctx.fillStyle = PAL[15];
          ctx.fillRect(tx, ty, 8, 8);
          ctx.fillStyle = PAL[14];
          ctx.fillRect(tx + 1, ty + 1, 2, 2);
          ctx.fillRect(tx + 5, ty + 4, 2, 2);
        } else if (t === T_DIRT) {
          const hp = room.wallHp[r][c];
          ctx.fillStyle = hp > 2 ? PAL[2] : PAL[3];
          ctx.fillRect(tx, ty, 8, 8);
          ctx.fillStyle = PAL[4];
          ctx.fillRect(tx + 1, ty + 2, 2, 1);
          ctx.fillRect(tx + 4, ty + 5, 3, 1);
          if (hp < 4) {
            ctx.fillStyle = PAL[0];
            ctx.fillRect(tx + 3, ty + 1, 1, 4);
            ctx.fillRect(tx + 2, ty + 4, 3, 1);
          }
        } else if (t === T_MAGMA) {
          ctx.fillStyle = pulse ? PAL[2] : PAL[3];
          ctx.fillRect(tx, ty, 8, 8);
          ctx.fillStyle = pulse ? PAL[4] : PAL[2];
          ctx.fillRect(tx + 1, ty + 1, 6, 3);
        } else if (t === T_SUPPORT) {
          ctx.fillStyle = PAL[13];
          ctx.fillRect(tx, ty, 8, 3);
          ctx.fillStyle = PAL[14];
          ctx.fillRect(tx + 1, ty + 3, 2, 2);
          ctx.fillRect(tx + 5, ty + 3, 2, 2);
        }
      }
    }

    // 2. Render Room Entities
    const animFrame = Math.floor(globalTick * 10) % 2 === 0;
    for (const ent of room.entities) {
      if (!ent.alive) continue;
      if (ent.type === 'miner') {
        drawSprite(animFrame ? 'miner1' : 'miner2', ent.x, ent.y, false);
      } else if (ent.type === 'battery') {
        drawSprite('battery', ent.x, ent.y + (animFrame ? 0 : -1), false);
      } else if (ent.type === 'gem') {
        drawSprite('gem', ent.x, ent.y + (animFrame ? 0 : -1), false);
      } else if (ent.type === 'bat') {
        drawSprite(animFrame ? 'bat1' : 'bat2', ent.x, ent.y, ent.vx < 0);
      } else if (ent.type === 'spider') {
        ctx.fillStyle = PAL[13];
        ctx.fillRect(Math.floor(ent.x + 3), Math.floor(ent.startY - 6), 1, Math.floor(ent.y - ent.startY + 6));
        drawSprite('spider', ent.x, ent.y, false);
      } else if (ent.type === 'snake') {
        drawSprite('snake', ent.x, ent.y, ent.vx < 0);
      } else if (ent.type === 'lantern') {
        drawSprite('lantern', ent.x, ent.y, false);
      }
    }

    // 3. Render Placed Dynamite
    for (const b of bombs) {
      drawSprite('dynamite', b.x, b.y, false);
      if (Math.floor(b.timer * 12) % 2 === 0) {
        ctx.fillStyle = PAL[4];
        ctx.fillRect(Math.floor(b.x + 5), Math.floor(b.y - 1), 2, 2);
      }
    }

    // 4. Render Player
    if (state !== GameState.DYING && state !== GameState.GAME_OVER) {
      const blink = player.invuln > 0 && Math.floor(player.invuln * 16) % 2 === 0;
      if (!blink) {
        const spr = player.flying && animFrame ? 'heroFly' : 'heroIdle';
        drawSprite(spr, player.x - 1, player.y, player.facing === -1);
      }
    }

    // 5. Render Helmet Lasers
    for (const l of lasers) {
      ctx.fillStyle = PAL[11];
      ctx.fillRect(Math.floor(l.x), Math.floor(l.y), 6, 2);
      ctx.fillStyle = PAL[12];
      ctx.fillRect(Math.floor(l.x + 1), Math.floor(l.y), 4, 1);
    }

    // 6. Render Explosions & Particles
    for (const ex of explosions) {
      ctx.fillStyle = PAL[4];
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r * (ex.life / 0.28), 0, Math.PI * 2);
      ctx.fill();
    }
    for (const p of particles) {
      ctx.fillStyle = PAL[p.color];
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 1, 1);
    }

    // 7. Darkness Mask when Ceiling Lantern is Broken (Offscreen destination-out mask)
    if (room.dark && state === GameState.PLAYING) {
      renderDarknessMask(room);
    }

    ctx.restore();

    // 8. Top HUD Bar (16px height)
    renderTopHUD();

    // 9. State Overlays (Title, Stage Clear, Game Over)
    renderOverlays();
  }

  function renderTopHUD() {
    ctx.fillStyle = PAL[8];
    ctx.fillRect(0, 0, SCREEN_W, HUD_H);
    ctx.fillStyle = PAL[10];
    ctx.fillRect(0, HUD_H - 1, SCREEN_W, 1);

    // Row 1 (y = 2): POWER Gauge & Dynamite Icons
    drawText('PWR', 3, 2, 12, 'left');
    const barX = 23;
    const barY = 2;
    const barW = 56;
    const barH = 5;
    ctx.fillStyle = PAL[0];
    ctx.fillRect(barX, barY, barW, barH);

    const fillW = Math.max(0, Math.round((player.power / 100) * (barW - 2)));
    let barColor = 6;
    if (player.power < 25) {
      barColor = Math.floor(globalTick * 12) % 2 === 0 ? 2 : 4;
    } else if (player.power < 50) {
      barColor = 4;
    }
    ctx.fillStyle = PAL[barColor];
    ctx.fillRect(barX + 1, barY + 1, fillW, barH - 2);

    // Dynamite Count + Mini Icons
    drawText(`BOMB:${player.dynamite}`, 86, 2, 4, 'left');
    const maxIcons = Math.min(5, player.dynamite);
    for (let i = 0; i < maxIcons; i++) {
      ctx.fillStyle = PAL[2];
      ctx.fillRect(132 + i * 4, 2, 2, 5);
      ctx.fillStyle = PAL[4];
      ctx.fillRect(132 + i * 4, 1, 1, 1);
    }

    // Lives & Stage on top right
    drawText(`1UP:${lives}`, 162, 2, 5, 'left');
    drawText(`STG:${stageIdx + 1}`, 202, 2, 11, 'left');

    // Row 2 (y = 9): Score, High Score & Sector
    drawText(`SCORE:${String(score).padStart(6, '0')}`, 3, 9, 12, 'left');
    drawText(`HI:${String(highScore).padStart(6, '0')}`, 86, 9, 13, 'left');
    drawText(`SEC[${currentRoomKey}]`, 162, 9, 11, 'left');
  }

  function renderOverlays() {
    if (state === GameState.TITLE) {
      ctx.fillStyle = 'rgba(26, 28, 44, 0.84)';
      ctx.fillRect(20, 26, 200, 96);
      ctx.strokeStyle = PAL[4];
      ctx.lineWidth = 1;
      ctx.strokeRect(20.5, 26.5, 199, 95);

      drawText('CAVE RESCUE 80', SCREEN_W / 2, 34, 4, 'center');
      drawText('TIC-80 SPEC H.E.R.O. ACTION', SCREEN_W / 2, 44, 11, 'center');
      drawText('RESCUE MINERS BEFORE POWER=0', SCREEN_W / 2, 58, 12, 'center');
      drawText('BOMB=1 HIT / LASER=4 HITS', SCREEN_W / 2, 68, 3, 'center');
      drawText('COLLECT BATTERIES & GEMS', SCREEN_W / 2, 78, 5, 'center');

      if (Math.floor(globalTick * 3) % 2 === 0) {
        drawText('TAP SCREEN OR PRESS FIRE', SCREEN_W / 2, 98, 4, 'center');
      }
    } else if (state === GameState.STAGE_CLEAR) {
      ctx.fillStyle = 'rgba(26, 28, 44, 0.88)';
      ctx.fillRect(28, 38, 184, 68);
      ctx.strokeStyle = PAL[5];
      ctx.strokeRect(28.5, 38.5, 183, 67);

      drawText('MINER RESCUED!', SCREEN_W / 2, 46, 5, 'center');
      drawText(`POWER BONUS: +${Math.round(player.power) * 10}`, SCREEN_W / 2, 60, 12, 'center');
      drawText(`BOMB BONUS:  +${player.dynamite * 150}`, SCREEN_W / 2, 70, 4, 'center');
      drawText('DESCENDING DEEPER...', SCREEN_W / 2, 86, 11, 'center');
    } else if (state === GameState.GAME_OVER) {
      ctx.fillStyle = 'rgba(26, 28, 44, 0.90)';
      ctx.fillRect(32, 38, 176, 68);
      ctx.strokeStyle = PAL[2];
      ctx.strokeRect(32.5, 38.5, 175, 67);

      drawText('MISSION FAILED', SCREEN_W / 2, 48, 2, 'center');
      drawText(`FINAL SCORE: ${score}`, SCREEN_W / 2, 64, 12, 'center');
      if (Math.floor(globalTick * 3) % 2 === 0) {
        drawText('TAP OR PRESS FIRE TO RETRY', SCREEN_W / 2, 84, 4, 'center');
      }
    }
  }

  // =========================================================================
  // 12. BOOTSTRAP & FIXED-TIMESTEP LOOP
  // =========================================================================
  let lastTimestamp = 0;

  function gameLoop(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min(0.05, Math.max(0.001, (timestamp - lastTimestamp) / 1000));
    lastTimestamp = timestamp;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  fitBezel();
  setupTouchControls();
  loadStage(0, true);
  render();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
